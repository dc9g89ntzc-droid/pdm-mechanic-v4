<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDM Mechanic Shop — Add Items</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17181a;
    --panel-border: #2a2b2e;
    --text: #f0ebe4;
    --text-dim: #9c9691;
    --red: #d81f27;
    --red-dim: #b8181f;
    --amber: #f0a52c;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button, .btn { background: var(--red); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; }
  header button.secondary, .btn.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); font-weight: 400; }
  header button:hover, .btn:hover { background: var(--red-dim); }

  .job-bar { padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .job-bar .job-title { font-weight: 600; font-size: 14px; }
  .job-bar .job-sub { color: var(--text-dim); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 4px; }

  .breadcrumb { padding: 12px 24px; font-size: 13px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; }
  .breadcrumb a { color: var(--text-dim); text-decoration: none; cursor: pointer; }
  .breadcrumb a:hover { color: var(--text); text-decoration: underline; }
  .breadcrumb .current { color: var(--text); font-weight: 600; }

  .layout { display: flex; gap: 20px; padding: 0 24px 40px; align-items: flex-start; flex-wrap: wrap; }
  main { flex: 1 1 560px; min-width: 0; }

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--panel-border); border-left: 3px solid var(--red); border-radius: 10px; padding: 18px; cursor: pointer; transition: border-color 0.15s; }
  .tile:hover { border-color: var(--red); background: rgba(216,31,39,0.06); }
  .tile .tile-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .tile .tile-count { color: var(--text-dim); font-size: 12px; }

  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .item-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .item-card img { width: 100%; height: 100px; object-fit: contain; background: var(--bg); border-radius: 8px; }
  .item-card .item-name { font-weight: 600; font-size: 13px; }
  .item-card .item-price { color: var(--amber); font-weight: 600; font-size: 13px; }
  .item-card .item-meta { color: var(--text-dim); font-size: 11px; }
  .item-card .item-meta.low { color: var(--red); }
  .item-card .add-row { display: flex; gap: 6px; margin-top: auto; }
  .item-card .add-row select { flex: 1; }
  .item-card .add-row input[type="number"] { width: 52px; }
  .item-card .add-row input, .item-card .add-row select {
    background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 6px; padding: 6px; font-size: 12px;
  }
  .item-card .add-row button { flex: 0 0 auto; background: var(--red); border: none; color: white; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .item-card .add-row button:hover { background: var(--red-dim); }

  .empty-msg { color: var(--text-dim); font-size: 13px; padding: 40px; text-align: center; }

  .search-bar { padding: 0 24px 12px; }
  .search-bar input {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--panel-border);
    color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .search-bar input:focus { outline: none; border-color: var(--red); }
  .item-card .item-store { color: var(--amber); font-size: 11px; font-weight: 600; }
  .export-txt-btn {
    display: block; width: 100%; text-align: center; box-sizing: border-box;
    background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim);
    padding: 9px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-top: 8px;
  }
  .export-txt-btn:hover { border-color: var(--red); color: var(--text); }

  .quote-panel { flex: 0 0 320px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; position: sticky; top: 16px; }
  .quote-panel h2 { font-size: 14px; margin: 0 0 12px; }
  /* Two rows per line -- name/icon/store tag on top (free to wrap, this
     catalogue has plenty of long performance-part names), qty/price/remove
     on their own row below. A single flex row here fought the fixed 320px
     panel width badly once names wrapped to 2-3 lines. */
  .quote-line { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--panel-border); font-size: 12px; }
  .quote-line .ql-top { display: flex; align-items: flex-start; gap: 8px; }
  .quote-line img { width: 32px; height: 32px; object-fit: contain; background: var(--bg); border-radius: 6px; flex: 0 0 auto; }
  .quote-line .ql-name { flex: 1; min-width: 0; line-height: 1.35; padding-top: 2px; }
  .quote-line .ql-stock { display: block; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
  .quote-line .ql-stock.short { color: var(--amber); }
  .quote-line .ql-stock.out { color: var(--red); }
  .quote-line .ql-store { color: var(--amber); font-size: 10px; font-weight: 700; white-space: nowrap; flex: 0 0 auto; padding-top: 2px; }
  .quote-line .ql-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 40px; }
  .quote-line .ql-qty { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .quote-line .ql-qty button { width: 20px; height: 20px; background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; }
  .quote-line .ql-price-group { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .quote-line .ql-total { text-align: right; color: var(--text-dim); background: none; border: none; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .quote-line .ql-total:hover { color: var(--text); text-decoration: underline dotted; }
  .quote-line .ql-price-input { width: 70px; background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 4px; padding: 2px 4px; font-size: 12px; text-align: right; }
  .quote-line .ql-remove { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .quote-line .ql-remove:hover { color: var(--red); }
  .quote-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; padding-top: 12px; margin-top: 4px; }
  .quote-empty { color: var(--text-dim); font-size: 12px; padding: 12px 0; }
  .leg-action-btn {
    display: block; width: 100%; text-align: center; box-sizing: border-box;
    background: var(--red); border: none; color: white; padding: 12px; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .leg-action-btn:hover { background: var(--red-dim); }

  .build-panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }

  /* ---- Engine Builder (engine_building leg, js/engineBuilder.js) ---- */
  .engine-style-hint { color: var(--text-dim); font-size: 12px; margin: 8px 0 0; min-height: 16px; }
  .engine-top { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 900px) { .engine-top { grid-template-columns: 1fr; } }
  .engine-picture { background: #f2f2f2; border-radius: 10px; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .engine-picture img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .engine-picture-missing { color: #777; font-size: 12px; text-align: center; padding: 16px; line-height: 1.5; }
  .engine-picture-missing code { color: #333; }
  .engine-facts { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
  .engine-facts strong { color: var(--text); }
  .engine-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .engine-table th { text-align: left; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; padding: 4px 6px; border-bottom: 1px solid var(--panel-border); }
  .engine-table td { padding: 6px; border-bottom: 1px solid var(--panel-border); vertical-align: middle; }
  .engine-table td.num, .engine-table th.num { text-align: right; white-space: nowrap; }
  .engine-table select { width: 100%; padding: 6px 8px; font-size: 12px; }
  .engine-table .slot-label { font-weight: 600; white-space: nowrap; }
  .engine-table .stock-short { color: var(--amber); font-size: 11px; }
  .engine-table tr.changed td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
  .engine-warning { color: var(--amber); font-size: 12px; margin-top: 8px; }
  .engine-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--panel-border); }
  .engine-footer .totals { font-size: 13px; color: var(--text-dim); }
  .engine-footer .totals strong { color: var(--text); font-size: 15px; }
  .build-panel h2 { font-size: 14px; margin: 0 0 12px; }
  .build-panel .build-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .attached-service-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--panel-border); font-size: 13px;
  }
  .attached-service-row:last-child { border-bottom: none; }
  .attached-service-row .as-fee { color: var(--amber); font-weight: 600; margin-left: auto; }
  .attached-service-row .as-remove {
    background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px;
  }
  .attached-service-row .as-remove:hover { border-color: var(--red); color: var(--red); }
  .services-empty { color: var(--text-dim); font-size: 12px; padding: 4px 0 2px; }
  .build-panel .build-field { flex: 1 1 160px; min-width: 140px; }
  .build-panel .build-field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .build-panel select { width: 100%; padding: 9px 10px; background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 8px; font-size: 13px; }
  .build-tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
  .build-tier { background: var(--bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .build-tier h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
  .build-tier.tier-cheap h3 { color: var(--text-dim); }
  .build-tier.tier-durable h3 { color: var(--amber); }
  .build-tier.tier-fastest h3 { color: var(--green); }
  .build-tier .caveat { color: var(--red); font-size: 11px; }
  .build-tier ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .build-tier ul li { display: flex; justify-content: space-between; gap: 8px; color: var(--text-dim); }
  .build-tier ul li .unavailable { color: var(--red); }
  .build-tier .tier-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; padding-top: 8px; border-top: 1px solid var(--panel-border); }

  /* Shared "job flow" chrome (sidebar stepper + summary panel) -- same
     block copy-pasted onto every per-job page (inspection/job-items/
     quote/receipt), matching this project's per-page-styles convention. */
  .flow-layout { display: flex; gap: 20px; align-items: flex-start; padding: 0 24px 40px; }
  .flow-sidebar, .flow-summary {
    flex: 0 0 240px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px;
    position: sticky;
    top: 16px;
  }
  .flow-title, .summary-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 16px;
  }
  .flow-title { color: var(--red); }
  .summary-title { color: var(--text-dim); }
  .flow-steps { display: flex; flex-direction: column; }
  .flow-step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; position: relative; }
  .flow-step:not(:last-child)::before {
    content: ''; position: absolute; left: 9px; top: 28px; bottom: -8px; width: 2px;
    background: var(--panel-border);
  }
  .flow-dot {
    flex: 0 0 20px; height: 20px; width: 20px; border-radius: 50%;
    border: 2px solid var(--panel-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-dim); background: var(--bg); z-index: 1;
  }
  .flow-step.done .flow-dot { background: var(--green); border-color: var(--green); color: white; }
  .flow-step.current .flow-dot { background: var(--amber); border-color: var(--amber); color: var(--bg); }
  .flow-label { font-size: 13px; font-weight: 600; }
  .flow-step.pending .flow-label { color: var(--text-dim); font-weight: 400; }
  .flow-state { font-size: 11px; color: var(--text-dim); }
  .flow-step.current .flow-state { color: var(--amber); }
  .flow-step.done .flow-state { color: var(--green); }
  .flow-add { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--panel-border); display: flex; flex-direction: column; gap: 8px; }
  .flow-add-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin-bottom: 2px; }
  .flow-add-btn {
    background: rgba(216,31,39,0.1); border: 1px solid var(--red); color: var(--red);
    padding: 9px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .flow-add-btn:hover { background: rgba(216,31,39,0.2); }
  .flow-add-btn:disabled { opacity: 0.5; cursor: default; }
  .summary-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--panel-border); }
  .summary-row:last-of-type { border-bottom: none; }
  .summary-label { color: var(--text-dim); }
  .summary-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin: 14px 0 8px; }
  .summary-notes { font-size: 13px; color: var(--text); line-height: 1.4; white-space: pre-wrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; }
  .badge.type-repair { background: rgba(216,31,39,0.15); color: #f0888c; }
  .badge.type-customisation { background: rgba(240,165,44,0.15); color: var(--amber); }
  .badge.type-performance { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.type-engine_building { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .badge.type-unclassified { background: rgba(156,150,145,0.15); color: var(--text-dim); font-style: italic; font-weight: 400; }
  @media (max-width: 980px) {
    .flow-layout { flex-wrap: wrap; }
    .flow-sidebar, .flow-summary { flex: 1 1 100%; position: static; }
  }
  /* Typed quantity between the - / + buttons (bindQtyInput in workshop.js). */
  .qty-input {
    width: 46px; padding: 2px 4px; text-align: center; font-size: 12px;
    background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); border-radius: 4px;
    -moz-appearance: textfield; appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-input:focus { outline: none; border-color: var(--red); }
</style>
</head>
<body>
  <header>
    <h1>PDM Mechanic Shop</h1>
    <nav>
      <a href="my-dashboard.html">Home</a>
      <a href="dashboard.html?area=repair">Workshop</a>
      <a href="checkin.html">New Job</a>
      <a href="quick-job.html">Quick Job</a>
      <a href="customers.html">Customers</a>
      <a href="configure.html">Configure</a>
      <a href="purchasing.html">Purchasing</a>
      <a href="reports.html">Reports</a>
      <a href="logs.html">Logs</a>
      <a href="staff.html">Staff</a>
      <a href="payroll.html">Payroll</a>
      <a href="accounts.html">Accounts</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="job-bar">
    <div>
      <div class="job-title" id="jobTitle">Loading job…</div>
      <div class="job-sub" id="jobSub"></div>
    </div>
    <div style="display:flex; gap:10px;">
      <a id="quoteLink" href="#" class="btn">View / generate quote</a>
      <a href="dashboard.html?area=repair" class="btn secondary">&larr; Back to Workshop</a>
    </div>
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="search-bar">
    <input type="text" id="itemSearchInput" placeholder="Search all items by name or keyword (e.g. &quot;exhaust manifold&quot;)…" />
  </div>

  <div class="flow-layout">
    <div class="flow-sidebar" id="flowSidebar"></div>
    <div class="layout" style="flex: 1 1 auto; padding: 0;">
      <div style="flex: 1 1 560px; min-width: 0;">
        <div class="build-panel" id="servicesPanel" style="display:none;">
          <h2>Services</h2>
          <div id="attachedServicesList"></div>
          <div class="build-row" style="margin-top:10px;">
            <div class="build-field" style="flex:1 1 300px;">
              <label for="serviceSelect">Attach a service</label>
              <select id="serviceSelect"></select>
            </div>
            <button type="button" class="btn" id="attachServiceBtn" style="flex:0 0 auto;">Attach</button>
          </div>
        </div>
        <div class="build-panel" id="buildPanel" style="display:none;">
          <h2>Suggested performance build</h2>
          <div class="build-row">
            <div class="build-field">
              <label for="buildStyle">Style</label>
              <select id="buildStyle"></select>
            </div>
            <div class="build-field">
              <label for="buildValvetrain">Valvetrain</label>
              <select id="buildValvetrain"></select>
            </div>
            <div class="build-field">
              <label for="buildConfig">Engine configuration</label>
              <select id="buildConfig"></select>
            </div>
            <button type="button" class="btn" id="buildSuggestBtn" style="flex: 0 0 auto;">Suggest parts</button>
          </div>
          <div class="build-tiers" id="buildTiers"></div>
        </div>
        <div class="build-panel" id="enginePanel" style="display:none;">
          <h2>Engine builder</h2>
          <div class="build-row">
            <div class="build-field">
              <label for="engineValvetrain">Engine type</label>
              <select id="engineValvetrain"></select>
            </div>
            <div class="build-field">
              <label for="engineConfig">Cylinders / layout</label>
              <select id="engineConfig"></select>
            </div>
            <div class="build-field">
              <label for="engineStyle">Style</label>
              <select id="engineStyle"></select>
            </div>
          </div>
          <p class="engine-style-hint" id="engineStyleHint"></p>
          <div class="engine-top">
            <div>
              <div class="engine-picture"><img id="enginePicture" alt="Engine" /><div id="enginePictureMissing" class="engine-picture-missing" style="display:none;"></div></div>
              <div class="engine-facts" id="engineFacts"></div>
            </div>
            <div>
              <table class="engine-table">
                <thead><tr><th>Part</th><th class="num">Qty</th><th>Choice</th><th class="num">Line total</th></tr></thead>
                <tbody id="engineParts"></tbody>
              </table>
              <div id="engineWarnings"></div>
            </div>
          </div>
          <div class="engine-footer">
            <div class="totals" id="engineTotals"></div>
            <button type="button" class="btn" id="engineApplyBtn">Add engine to job</button>
          </div>
        </div>
        <main id="mainArea"></main>
      </div>
      <aside class="quote-panel">
        <h2 id="quotePanelTitle">Items on this job</h2>
        <div id="quoteLines"></div>
        <div id="exportBtnArea"></div>
        <div class="quote-total"><span>Total</span><span id="quoteTotal">To confirm</span></div>
        <div class="quote-total" id="estLabourRow" style="display:none; font-weight:400; font-size:12px; color:var(--text-dim); padding-top:2px;">
          <span>Est. labour</span><span id="estLabourValue"></span>
        </div>
        <div id="legActionArea" style="margin-top: 14px;"></div>
      </aside>
    </div>
    <div class="flow-summary" id="flowSummary"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/workshop.js"></script>
<script src="js/jobflow.js"></script>
<script src="js/shift.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/services.js"></script>
<script src="js/shoppingList.js"></script>
<script src="js/performanceBuild.js"></script>
<script src="js/engineBuilder.js"></script>
<script>
  const session = requireSession();
  if (session) {
    document.getElementById('whoami').textContent = `${session.employee_name} (${session.role})`;
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  applyRoleNav(session);

  const params = new URLSearchParams(location.search);
  const jobId = params.get('job');
  const mainArea = document.getElementById('mainArea');
  const breadcrumb = document.getElementById('breadcrumb');

  let job = null;
  let jobType = params.get('type');
  let currentLeg = null;
  let level = 'categories'; // categories | subcategories | items
  let currentCategory = null;
  let currentSubcategory = null; // { id, name }

  if (!jobId) {
    mainArea.innerHTML = '<div class="empty-msg">No job specified.</div>';
    throw new Error('No job id in URL');
  }

  // A link from before per-leg items existed (or from outside the board)
  // won't carry &type= -- fall back to whichever leg is currently active,
  // same leg the board itself would be showing this job under. Also
  // resolves the leg's own row so its status can drive which mode this
  // page renders in (add-materials vs materials-required).
  async function resolveJobType() {
    const legs = await listJobLegs(jobId);
    if (!jobType) {
      const active = activeLegForJob(legs);
      jobType = active ? active.job_type : null;
    }
    currentLeg = legs.find((l) => l.job_type === jobType) || null;
  }

  async function loadJobBar() {
    job = await getJobSummary(jobId);
    const vehicle = job.owned_vehicles ? `${job.owned_vehicles.make || ''} ${job.owned_vehicles.model || ''}`.trim() || 'Unknown vehicle' : 'Unknown vehicle';
    const reg = job.owned_vehicles?.registration || 'Unknown';
    document.getElementById('jobTitle').textContent = `Job #${job.job_number} — ${job.customers?.customer_name || 'Unknown customer'}${jobType ? ` — ${jobTypeLabel(jobType)}` : ''}`;
    document.getElementById('jobSub').textContent = `${vehicle} · ${reg} · ${jobStatusLabel(job.status)}`;
    document.getElementById('quoteTotal').textContent = `${formatMoney(job.quoted_total)} + labour`;
    document.getElementById('quoteLink').href = `quote.html?job=${jobId}`;
  }

  async function renderFlowChrome() {
    // Re-fetch rather than reuse the outer `job` -- this also runs right
    // after the sidebar's own "+ Add work type" button, which just changed
    // job.job_types server-side.
    job = await getJobSummary(jobId);
    renderFlowSidebar(document.getElementById('flowSidebar'), {
      jobId, jobTypes: job.job_types || [], legs: await listJobLegs(jobId), onAdded: renderFlowChrome
    });
    let mechanicName = null;
    if (job.assigned_staff_id) {
      try {
        const staff = await getStaffMember(job.assigned_staff_id);
        if (staff) mechanicName = staff.employee_name;
      } catch (err) { /* ignore -- summary panel just shows Unassigned */ }
    }
    renderJobSummaryPanel(document.getElementById('flowSummary'), job, mechanicName);
  }

  // The aside's primary action changes with the current leg's own status --
  // add materials while still quoting, then "Start Work"/"Work Complete"
  // once the customer's agreed, all on this same page.
  function renderLegAction() {
    const area = document.getElementById('legActionArea');
    const title = document.getElementById('quotePanelTitle');
    const status = currentLeg ? currentLeg.status : null;
    if (status === 'approved') {
      title.textContent = 'Materials required';
      area.innerHTML = `<button type="button" class="leg-action-btn" id="startWorkBtn">Start Work →</button>`;
      document.getElementById('startWorkBtn').addEventListener('click', async () => {
        try {
          await updateLegStatus(jobId, jobType, 'work_in_progress');
          currentLeg.status = 'work_in_progress';
          renderLegAction();
          renderExportButton();
        } catch (err) {
          alert(`Failed to start work: ${err.message}`);
        }
      });
    } else if (status === 'work_in_progress' || status === 'waiting_for_parts') {
      title.textContent = 'Materials required';
      area.innerHTML = `<button type="button" class="leg-action-btn" id="workCompleteBtn">Work Complete →</button>`;
      document.getElementById('workCompleteBtn').addEventListener('click', async () => {
        try {
          await updateLegStatus(jobId, jobType, 'completed');
          const legs = await listJobLegs(jobId);
          window.location.href = jobFlowUrlFor(jobId, legs);
        } catch (err) {
          alert(`Failed to complete work: ${err.message}`);
        }
      });
    } else if (status === 'quote_preparation') {
      title.textContent = 'Items on this job';
      area.innerHTML = `<a href="quote.html?job=${jobId}" class="leg-action-btn">Generate / View Quote →</a>`;
    } else {
      title.textContent = 'Items on this job';
      area.innerHTML = '';
    }
  }

  function renderBreadcrumb() {
    const parts = ['<a id="bcRoot">Categories</a>'];
    if (currentCategory) parts.push(`<span>/</span>${level === 'subcategories' ? `<span class="current">${currentCategory}</span>` : `<a id="bcCategory">${currentCategory}</a>`}`);
    if (currentSubcategory) parts.push(`<span>/</span><span class="current">${currentSubcategory.name}</span>`);
    breadcrumb.innerHTML = parts.join(' ');
    document.getElementById('bcRoot').addEventListener('click', () => showCategories());
    const bcCat = document.getElementById('bcCategory');
    if (bcCat) bcCat.addEventListener('click', () => showSubcategories(currentCategory));
  }

  async function showCategories() {
    level = 'categories'; currentCategory = null; currentSubcategory = null;
    renderBreadcrumb();
    mainArea.innerHTML = '<div class="empty-msg">Loading categories…</div>';
    try {
      let categories = await listDistinctCategories();
      // Scoped to the categories that actually belong on this leg, plus
      // Tools/Scrap Material which aren't leg-specific -- keeps a part from
      // ending up added under the wrong job_type (and billed at the wrong
      // install-charge rate). Falls back to showing everything if this
      // leg's job_type has no mapped category, rather than showing nothing.
      const relevantCategory = CATEGORY_FOR_JOB_TYPE[jobType];
      if (relevantCategory) {
        categories = categories.filter((c) => c === relevantCategory || ALWAYS_SHOWN_CATEGORIES.includes(c));
      }
      if (categories.length === 0) { mainArea.innerHTML = '<div class="empty-msg">No catalogue categories yet.</div>'; return; }
      const grid = document.createElement('div');
      grid.className = 'tile-grid';
      categories.forEach((c) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.borderLeftColor = categoryColor(c);
        tile.innerHTML = `<div class="tile-name">${c}</div><div class="tile-count">Browse items</div>`;
        tile.addEventListener('click', () => showSubcategories(c));
        grid.appendChild(tile);
      });
      mainArea.innerHTML = '';
      mainArea.appendChild(grid);
    } catch (err) {
      mainArea.innerHTML = `<div class="empty-msg">Failed to load categories: ${err.message}</div>`;
    }
  }

  async function showSubcategories(category) {
    level = 'subcategories'; currentCategory = category; currentSubcategory = null;
    renderBreadcrumb();
    mainArea.innerHTML = '<div class="empty-msg">Loading subcategories…</div>';
    try {
      const subcats = await listSubcategoriesForCategory(category);
      if (subcats.length === 0) { mainArea.innerHTML = '<div class="empty-msg">No items in this category yet.</div>'; return; }
      const grid = document.createElement('div');
      grid.className = 'tile-grid';
      subcats.forEach((s) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.style.borderLeftColor = categoryColor(category);
        tile.innerHTML = `<div class="tile-name">${s.name}</div><div class="tile-count">${s.count} item${s.count === 1 ? '' : 's'}</div>`;
        tile.addEventListener('click', () => showItems(category, s));
        grid.appendChild(tile);
      });
      mainArea.innerHTML = '';
      mainArea.appendChild(grid);
    } catch (err) {
      mainArea.innerHTML = `<div class="empty-msg">Failed to load subcategories: ${err.message}</div>`;
    }
  }

  // Shared by the category/subcategory tile browser AND the search box --
  // same card, same add-to-job behaviour, regardless of how the item was
  // found.
  function renderItemGrid(items) {
    const grid = document.createElement('div');
    grid.className = 'item-grid';
    items.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      const low = item.reorder_threshold !== null && item.stock_quantity <= item.reorder_threshold;
      const img = item.image_url
        ? `<img src="${item.image_url}" alt="${item.name}" />`
        : `<div style="width:100%;height:100px;background:var(--bg);border-radius:8px;"></div>`;
      const storeLabel = sourceStoreLabel(item);
      card.innerHTML = `
        ${img}
        <div class="item-name">${item.name}</div>
        <div class="item-price">${item.customer_price !== null ? formatMoney(item.customer_price) : 'To confirm'}</div>
        <div class="item-meta ${low ? 'low' : ''}">${sourcingLabel(item.sourcing)} · Stock: ${item.stock_quantity}</div>
        <div class="item-meta">${stockSplitLabel(item)}</div>
        ${storeLabel ? `<div class="item-store">${storeLabel}</div>` : ''}
        <div class="add-row">
          <input type="number" class="qty-input" min="0.01" step="1" value="1" />
          <button class="add-btn">Add</button>
        </div>
      `;
      // Whether this part ends up purchased or crafted only matters for
      // which internal tab (Purchasing, or crafting once that exists)
      // picks it up -- not something the mechanic decides while working
      // a job, so it's never asked here.
      card.querySelector('.add-btn').addEventListener('click', async () => {
        const qty = Number(card.querySelector('.qty-input').value || 1);
        try {
          await addJobItem({ jobId, catalogueItem: item, quantity: qty, sourcingChoice: null, performedBy: session?.id, jobType });
          await refreshQuote();
        } catch (err) {
          alert(`Failed to add item: ${err.message}`);
        }
      });
      grid.appendChild(card);
    });
    return grid;
  }

  async function showItems(category, subcategory) {
    level = 'items'; currentCategory = category; currentSubcategory = subcategory;
    renderBreadcrumb();
    mainArea.innerHTML = '<div class="empty-msg">Loading items…</div>';
    try {
      const items = await listItemsForTile(category, subcategory.id);
      if (items.length === 0) { mainArea.innerHTML = '<div class="empty-msg">No items here.</div>'; return; }
      mainArea.innerHTML = '';
      mainArea.appendChild(renderItemGrid(items));
    } catch (err) {
      mainArea.innerHTML = `<div class="empty-msg">Failed to load items: ${err.message}</div>`;
    }
  }

  // Searches every category/subcategory at once (name, description, notes)
  // -- the actual fix for "spent ages looking for exhaust manifold", where
  // guessing the right tile first was the slow part.
  const itemSearchInput = document.getElementById('itemSearchInput');
  async function showSearchResults(query) {
    breadcrumb.innerHTML = `<span>Search results for "${query}"</span> <a id="bcClearSearch" style="margin-left:8px;">&times; Clear</a>`;
    document.getElementById('bcClearSearch').addEventListener('click', () => {
      itemSearchInput.value = '';
      showCategories();
    });
    mainArea.innerHTML = '<div class="empty-msg">Searching…</div>';
    try {
      const items = await listCatalogueItems({ search: query, activeOnly: true });
      if (items.length === 0) { mainArea.innerHTML = '<div class="empty-msg">No items match that search.</div>'; return; }
      mainArea.innerHTML = '';
      mainArea.appendChild(renderItemGrid(items));
    } catch (err) {
      mainArea.innerHTML = `<div class="empty-msg">Search failed: ${err.message}</div>`;
    }
  }

  itemSearchInput.addEventListener('input', () => {
    clearTimeout(itemSearchInput._t);
    const q = itemSearchInput.value.trim();
    itemSearchInput._t = setTimeout(() => {
      if (q) showSearchResults(q);
      else showCategories();
    }, 250);
  });

  // Materials-required mode is any leg status past quoting -- approved,
  // in progress, or waiting on parts -- matching renderLegAction()'s own
  // three-way split below.
  const MATERIALS_REQUIRED_STATUSES = ['approved', 'work_in_progress', 'waiting_for_parts'];
  let lastQuoteLines = [];

  // Sends this leg's materials to the shopping list (purchasing.html),
  // conglomerating quantities with anything already there from other jobs
  // -- the .txt export itself now lives on that list (more useful to a
  // stocker as one combined list than one job's worth at a time).
  async function addMaterialsToShoppingList() {
    const btn = document.getElementById('addToShopListBtn');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      await addJobItemsToShoppingList(lastQuoteLines, session?.id);
      logActivity({
        actorId: session?.id, action: 'materials_added_to_shopping_list', entityType: 'job', entityId: jobId,
        summary: `${session?.employee_name || 'Someone'} added Job #${job?.job_number}'s materials to the shopping list`
      });
      btn.textContent = 'Added ✓';
      setTimeout(() => { btn.textContent = 'Add to shopping list'; btn.disabled = false; }, 1500);
    } catch (err) {
      alert(`Failed to add to shopping list: ${err.message}`);
      btn.disabled = false;
      btn.textContent = 'Add to shopping list';
    }
  }

  function renderExportButton() {
    const area = document.getElementById('exportBtnArea');
    const inMaterialsMode = currentLeg && MATERIALS_REQUIRED_STATUSES.includes(currentLeg.status);
    if (inMaterialsMode && lastQuoteLines.length > 0) {
      area.innerHTML = '<button type="button" class="export-txt-btn" id="addToShopListBtn">Add to shopping list</button>';
      document.getElementById('addToShopListBtn').addEventListener('click', addMaterialsToShoppingList);
    } else {
      area.innerHTML = '';
    }
  }

  // Live stock left after this job's own use (parts are taken out of stock as
  // they're added). Jobs draw from the shop first, so it's flagged amber when
  // the shop has run out and red when there's none anywhere.
  function stockLine(item) {
    if (!item || item.stock_quantity === undefined) return '';
    const total = Number(item.stock_quantity) || 0;
    const shop = Number(item.stock_shop) || 0;
    const cls = total <= 0 ? 'out' : shop <= 0 ? 'short' : '';
    return `<span class="ql-stock ${cls}">In stock: ${total} (${stockSplitLabel(item)})</span>`;
  }

  async function refreshQuote() {
    const linesEl = document.getElementById('quoteLines');
    try {
      await labourRatesReady;
      const lines = await listJobItems(jobId, jobType);
      lastQuoteLines = lines;
      if (jobType === 'engine_building') {
        document.getElementById('engineApplyBtn').textContent = lines.length ? 'Replace engine on job' : 'Add engine to job';
      }
      renderExportButton();
      // Prefer the real flat fee from attached services (sql/043) once one
      // exists -- a hand-picked price for a named job. Otherwise the
      // per-component install charge (sql/046/047) -- also a real,
      // deterministic number, not a guess, the moment any part's added.
      const estLabourRow = document.getElementById('estLabourRow');
      const jobServicesForLeg = await listJobServices(jobId, jobType);
      const svcFee = serviceLabourFeeForType(jobServicesForLeg, jobType);
      const estLabourLabel = estLabourRow.querySelector('span');
      if (svcFee !== undefined) {
        estLabourLabel.textContent = 'Labour (service)';
        estLabourRow.title = 'Flat labour fee from the service(s) attached to this leg.';
        document.getElementById('estLabourValue').textContent = formatMoney(svcFee);
        estLabourRow.style.display = 'flex';
      } else {
        const charge = installChargeForType(lines, jobType);
        estLabourLabel.textContent = 'Labour (install charge)';
        estLabourRow.title = `${INSTALL_CHARGE_BY_JOB_TYPE[jobType] != null ? formatMoney(INSTALL_CHARGE_BY_JOB_TYPE[jobType]) : '?'} per distinct component installed under this work type.`;
        if (charge !== null) {
          document.getElementById('estLabourValue').textContent = formatMoney(charge);
          estLabourRow.style.display = 'flex';
        } else {
          estLabourRow.style.display = 'none';
        }
      }
      if (lines.length === 0) {
        linesEl.innerHTML = '<div class="quote-empty">No items added yet.</div>';
      } else {
        linesEl.innerHTML = '';
        lines.forEach((line) => {
          const row = document.createElement('div');
          row.className = 'quote-line';
          const img = line.catalogue_items?.image_url
            ? `<img src="${line.catalogue_items.image_url}" alt="" />`
            : `<div style="width:32px;height:32px;background:var(--bg);border-radius:6px;"></div>`;
          const lineTotal = line.unit_price !== null ? formatMoney(Number(line.unit_price) * Number(line.quantity)) : 'To confirm';
          const storeLabel = line.catalogue_items ? sourceStoreLabel(line.catalogue_items) : '';
          row.innerHTML = `
            <div class="ql-top">
              ${img}
              <div class="ql-name">${line.catalogue_items?.name || 'Unknown item'}${stockLine(line.catalogue_items)}</div>
              ${storeLabel ? `<span class="ql-store">${storeLabel}</span>` : ''}
            </div>
            <div class="ql-bottom">
              <div class="ql-qty">
                <button class="qty-dec">−</button>
                <input type="number" class="qty-input" aria-label="Quantity" />
                <button class="qty-inc">+</button>
              </div>
              <div class="ql-price-group">
                <button class="ql-total" title="Click to override unit price">${lineTotal}</button>
                <button class="ql-remove">✕</button>
              </div>
            </div>
          `;
          bindQtyInput(row.querySelector('.qty-input'), Number(line.quantity), async (newQty) => {
            try {
              if (newQty === 0) {
                await removeJobItem(line.id, line.catalogue_item_id, Number(line.quantity), session?.id, jobId);
              } else {
                await updateJobItemQuantity(line.id, line.catalogue_item_id, newQty, Number(line.quantity), session?.id, jobId);
              }
            } catch (err) {
              alert(`Failed to update quantity: ${err.message}`);
            }
            await refreshQuote();
          });
          row.querySelector('.qty-inc').addEventListener('click', async () => {
            await updateJobItemQuantity(line.id, line.catalogue_item_id, Number(line.quantity) + 1, Number(line.quantity), session?.id, jobId);
            await refreshQuote();
          });
          row.querySelector('.qty-dec').addEventListener('click', async () => {
            const newQty = Number(line.quantity) - 1;
            if (newQty <= 0) {
              await removeJobItem(line.id, line.catalogue_item_id, Number(line.quantity), session?.id, jobId);
            } else {
              await updateJobItemQuantity(line.id, line.catalogue_item_id, newQty, Number(line.quantity), session?.id, jobId);
            }
            await refreshQuote();
          });
          row.querySelector('.ql-remove').addEventListener('click', async () => {
            await removeJobItem(line.id, line.catalogue_item_id, Number(line.quantity), session?.id, jobId);
            await refreshQuote();
          });
          row.querySelector('.ql-total').addEventListener('click', (e) => {
            const btn = e.currentTarget;
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.step = '0.01';
            input.className = 'ql-price-input';
            input.value = line.unit_price ?? '';
            input.placeholder = 'Price';
            btn.replaceWith(input);
            input.focus();
            input.select();

            const commit = async () => {
              const newPrice = input.value === '' ? null : Number(input.value);
              const oldPrice = line.unit_price;
              if (newPrice === oldPrice || (newPrice === null && oldPrice === null)) { await refreshQuote(); return; }
              try {
                await updateJobItemUnitPrice(line.id, newPrice);
                logActivity({
                  actorId: session?.id, action: 'job_item_price_overridden', entityType: 'job_item', entityId: line.id,
                  summary: `${session?.employee_name || 'Someone'} changed the price of "${line.catalogue_items?.name || 'an item'}" on Job #${job.job_number} from ${formatMoney(oldPrice)} to ${formatMoney(newPrice)}`
                });
              } catch (err) {
                alert(`Failed to update price: ${err.message}`);
              }
              await refreshQuote();
            };
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (ev) => {
              if (ev.key === 'Enter') input.blur();
              if (ev.key === 'Escape') { input.value = line.unit_price ?? ''; input.blur(); }
            });
          });
          linesEl.appendChild(row);
        });
      }
      await loadJobBar();
    } catch (err) {
      linesEl.innerHTML = `<div class="quote-empty">Failed to load items: ${err.message}</div>`;
    }
  }

  // ---- Services (flat labour fee, sql/043) ----
  async function renderAttachedServices() {
    const listEl = document.getElementById('attachedServicesList');
    const attached = await listJobServices(jobId, jobType);
    if (attached.length === 0) {
      listEl.innerHTML = '<div class="services-empty">No services attached to this leg yet.</div>';
    } else {
      listEl.innerHTML = attached.map((js) => `
        <div class="attached-service-row" data-id="${js.id}">
          <span>${js.services?.name || 'Unknown service'}</span>
          <span class="as-fee">${js.labour_fee !== null ? formatMoney(js.labour_fee) : 'To confirm'}</span>
          <button type="button" class="as-remove" data-id="${js.id}">Remove</button>
        </div>
      `).join('');
      listEl.querySelectorAll('.as-remove').forEach((btn) => {
        btn.addEventListener('click', async () => {
          try {
            await removeServiceFromJob(btn.dataset.id);
            await renderAttachedServices();
          } catch (err) {
            alert(`Failed to remove service: ${err.message}`);
          }
        });
      });
    }
    return attached;
  }

  async function initServicesPanel() {
    const panel = document.getElementById('servicesPanel');
    const select = document.getElementById('serviceSelect');
    let services = [];
    try {
      services = await listServices({ jobTypeCategory: jobType, activeOnly: true });
    } catch (err) {
      panel.style.display = 'none';
      return;
    }
    const attached = await renderAttachedServices();
    if (services.length === 0 && attached.length === 0) {
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    select.innerHTML = services.length > 0
      ? services.map((s) => `<option value="${s.id}">${s.name} — ${s.labour_fee !== null ? formatMoney(s.labour_fee) : 'To confirm'}</option>`).join('')
      : '<option value="">No services defined for this work type yet</option>';
    document.getElementById('attachServiceBtn').disabled = services.length === 0;

    document.getElementById('attachServiceBtn').onclick = async () => {
      const service = services.find((s) => s.id === select.value);
      if (!service) return;
      const btn = document.getElementById('attachServiceBtn');
      btn.disabled = true;
      try {
        await addServiceToJob({ jobId, jobType, service, performedBy: session?.id });
        logActivity({
          actorId: session?.id, action: 'service_attached_to_job', entityType: 'job', entityId: jobId,
          summary: `${session?.employee_name || 'Someone'} attached service "${service.name}" to Job #${job.job_number}`
        });
        await Promise.all([renderAttachedServices(), refreshQuote()]);
      } catch (err) {
        alert(`Failed to attach service: ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    };
  }

  // ---- Suggested performance build (performance-leg jobs only) ----
  const TIER_LABELS = { cheap: 'Cheap', durable: 'Durable', fastest: 'Fastest' };
  // Resolving a name to a real catalogue row is looked up fresh each time
  // "Suggest parts" is clicked (not cached) -- stock/price can move between
  // uses, and this only ever fires on an explicit click, not per keystroke.
  const catalogueItemCache = {};
  async function resolveCatalogueItemByName(name) {
    if (name in catalogueItemCache) return catalogueItemCache[name];
    const exact = await getCatalogueItemByExactName(name);
    catalogueItemCache[name] = exact;
    return exact;
  }

  function initBuildPanel() {
    if (jobType !== 'performance') return;
    document.getElementById('buildPanel').style.display = 'block';
    const styleSelect = document.getElementById('buildStyle');
    const valvetrainSelect = document.getElementById('buildValvetrain');
    const configSelect = document.getElementById('buildConfig');
    styleSelect.innerHTML = STYLE_OPTIONS.map((s) => `<option value="${s.value}">${s.label}</option>`).join('');
    valvetrainSelect.innerHTML = VALVETRAIN_OPTIONS.map((v) => `<option value="${v}">${v}</option>`).join('');

    // Rotary has no camshafts/valves, so it only ever pairs with a Rotor
    // Housing configuration -- everything else only ever pairs with a real
    // Engine Block. Filtering here instead of just adding 'Rotary' to the
    // list keeps the two dropdowns from landing on a nonsensical
    // combination (e.g. DOHC + Four Rotor).
    function refreshConfigOptions() {
      const wantRotor = valvetrainSelect.value === 'Rotary';
      const options = ENGINE_CONFIGURATIONS.filter((c) => (c.subcategory === 'Rotor Housings') === wantRotor);
      const previous = configSelect.value;
      configSelect.innerHTML = options.map((c) => `<option value="${c.value}">${c.value}</option>`).join('');
      if (options.some((c) => c.value === previous)) configSelect.value = previous;
    }
    valvetrainSelect.addEventListener('change', refreshConfigOptions);
    refreshConfigOptions();

    document.getElementById('buildSuggestBtn').addEventListener('click', () => {
      renderBuildTiers({
        style: styleSelect.value,
        valvetrain: valvetrainSelect.value,
        configuration: configSelect.value
      });
    });
  }

  async function renderBuildTiers({ style, valvetrain, configuration }) {
    const tiersEl = document.getElementById('buildTiers');
    tiersEl.innerHTML = '<div class="empty-msg">Looking up parts…</div>';
    const suggestion = suggestPerformanceBuild({ style, valvetrain, configuration });

    const resolved = {};
    for (const tier of ['cheap', 'durable', 'fastest']) {
      resolved[tier] = await Promise.all(
        suggestion[tier].map(async (entry) => ({ ...entry, catalogueItem: await resolveCatalogueItemByName(entry.itemName) }))
      );
    }

    tiersEl.innerHTML = ['cheap', 'durable', 'fastest'].map((tier) => {
      const items = resolved[tier];
      const total = items.reduce((sum, i) => sum + (i.catalogueItem?.customer_price != null ? Number(i.catalogueItem.customer_price) * i.quantity : 0), 0);
      const caveat = tier === 'cheap' ? cheapTierCaveat(style) : (tier === 'fastest' ? FASTEST_TIER_CAVEAT : null);
      return `
        <div class="build-tier tier-${tier}" data-tier="${tier}">
          <h3>${TIER_LABELS[tier]}</h3>
          ${caveat ? `<div class="caveat">${caveat}</div>` : ''}
          <ul>
            ${items.map((i) => i.catalogueItem
              ? `<li><span>${i.quantity}x ${i.catalogueItem.name}</span><span>${i.catalogueItem.customer_price != null ? formatMoney(i.catalogueItem.customer_price) : 'To confirm'}</span></li>`
              : `<li><span class="unavailable">${i.itemName} (not in catalogue)</span></li>`
            ).join('')}
          </ul>
          <div class="tier-total"><span>Total</span><span>${formatMoney(total)}</span></div>
          <button type="button" class="btn add-tier-btn" data-tier="${tier}">Add to job</button>
        </div>
      `;
    }).join('');

    tiersEl.querySelectorAll('.add-tier-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const tier = btn.dataset.tier;
        try {
          for (const entry of resolved[tier]) {
            if (!entry.catalogueItem) continue; // skipped -- flagged as unavailable in the list above
            await addJobItem({ jobId, catalogueItem: entry.catalogueItem, quantity: entry.quantity, sourcingChoice: null, performedBy: session?.id, jobType });
          }
          await refreshQuote();
        } catch (err) {
          alert(`Failed to add tier to job: ${err.message}`);
        }
      });
    });
  }

  // ---- Engine builder (engine_building leg) ----
  // Engine type + layout + style -> every engine part with a default pick
  // per style; each part's dropdown offers every matching catalogue part.
  // "Add engine to job" puts the whole build on this leg (replacing a
  // previous build) and saves the spec for the quote and bill.
  let engineItems = [];           // every active catalogue row (name-matched per slot)
  let engineChoice = {};          // slot key -> catalogue item id
  let engineSpecView = null;      // buildEngineSpec() result on screen

  async function loadEngineCatalogue() {
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('catalogue_items')
        .select('id, name, customer_price, purchase_cost, craft_cost, sourcing, image_url, stock_quantity')
        .eq('active', true).order('name').range(from, from + 999);
      if (error) throw new Error(error.message);
      rows.push(...data);
      if (data.length < 1000) return rows;
    }
  }

  function engineCurrentSpec() {
    return {
      valvetrain: document.getElementById('engineValvetrain').value,
      configuration: document.getElementById('engineConfig').value,
      style: document.getElementById('engineStyle').value
    };
  }

  function refreshEngineConfigOptions(preferred) {
    const vt = document.getElementById('engineValvetrain').value;
    const select = document.getElementById('engineConfig');
    const options = engineConfigurationsFor(vt);
    const keep = preferred || select.value;
    select.innerHTML = options.map((c) => `<option value="${c}">${c}</option>`).join('');
    if (options.includes(keep)) select.value = keep;
  }

  // Tries the uploaded engine pictures, then the block's catalogue image;
  // if none exist yet, says which file to upload instead of a broken image.
  function setEnginePicture(spec, blockItem) {
    const img = document.getElementById('enginePicture');
    const missing = document.getElementById('enginePictureMissing');
    const candidates = [...engineImageCandidates(spec.valvetrain, spec.configuration)];
    if (blockItem?.image_url) candidates.push(blockItem.image_url);
    let i = 0;
    img.style.display = '';
    missing.style.display = 'none';
    img.onerror = () => {
      i += 1;
      if (i < candidates.length) { img.src = candidates[i]; return; }
      img.onerror = null;
      img.style.display = 'none';
      const file = candidates[0].split('/').pop();
      missing.innerHTML = `No picture for ${engineSpecLabel(spec).split(' · ')[0]} yet.<br>Upload <code>engines/${file}</code> to the item icons bucket.`;
      missing.style.display = 'block';
    };
    img.src = candidates[0];
    img.alt = engineSpecLabel(spec);
  }

  // keepChoices: keep the mechanic's dropdown picks where they still apply
  // (e.g. only the style changed) instead of resetting every part.
  function renderEngineBuilder({ keepChoices = false } = {}) {
    const spec = engineCurrentSpec();
    engineSpecView = buildEngineSpec(spec);
    document.getElementById('engineStyleHint').textContent = ENGINE_STYLE_PROFILES[spec.style]?.hint || '';
    const byId = Object.fromEntries(engineItems.map((it) => [it.id, it]));

    const rows = engineSpecView.slots.map((slot) => {
      const { options, preferred } = engineSlotOptions(slot, engineItems);
      const kept = keepChoices && engineChoice[slot.key] && options.some((o) => o.id === engineChoice[slot.key]);
      if (!kept) engineChoice[slot.key] = (preferred || options[0])?.id || null;
      return { slot, options, preferred };
    });

    document.getElementById('engineParts').innerHTML = rows.map(({ slot, options, preferred }) => {
      const chosen = byId[engineChoice[slot.key]];
      const lineTotal = chosen && chosen.customer_price != null ? formatMoney(Number(chosen.customer_price) * slot.quantity) : 'To confirm';
      const short = chosen && Number(chosen.stock_quantity) < slot.quantity
        ? `<div class="stock-short">${Math.max(0, Number(chosen.stock_quantity) || 0)} in stock</div>` : '';
      const changed = preferred && chosen && chosen.id !== preferred.id;
      return `
        <tr class="${changed ? 'changed' : ''}" title="${changed ? `Style default: ${preferred.name}` : ''}">
          <td class="slot-label">${slot.label}</td>
          <td class="num">${slot.quantity}</td>
          <td>
            ${options.length
              ? `<select data-slot="${slot.key}">${options.map((o) => `<option value="${o.id}" ${o.id === engineChoice[slot.key] ? 'selected' : ''}>${o.name}${o.customer_price != null ? ` — ${formatMoney(o.customer_price)}` : ''}${preferred && o.id === preferred.id ? '  ★' : ''}</option>`).join('')}</select>${short}`
              : '<span class="stock-short">No matching parts in the catalogue</span>'}
          </td>
          <td class="num">${lineTotal}</td>
        </tr>`;
    }).join('');

    document.querySelectorAll('#engineParts select[data-slot]').forEach((sel) => {
      sel.addEventListener('change', () => {
        engineChoice[sel.dataset.slot] = sel.value;
        renderEngineBuilder({ keepChoices: true });
      });
    });

    // Picture, facts, warnings, totals
    const blockSlot = engineSpecView.slots.find((sl) => sl.key === 'block' || sl.key === 'rotor_housing');
    setEnginePicture(spec, blockSlot ? byId[engineChoice[blockSlot.key]] : null);
    const v = engineSpecView;
    document.getElementById('engineFacts').innerHTML = v.isRotary
      ? `<strong>${engineSpecLabel(spec)}</strong><br>${v.rotors} rotor${v.rotors === 1 ? '' : 's'}`
      : `<strong>${engineSpecLabel(spec)}</strong><br>${v.cylinders} cylinder${v.cylinders === 1 ? '' : 's'} · ${v.banks} bank${v.banks === 1 ? '' : 's'} · ${v.totalValves} valves`;

    const warnings = [];
    const tappet = byId[engineChoice.tappets];
    const spring = byId[engineChoice.valve_springs];
    const mismatch = tappet && spring ? valveSpringMismatch(tappet.name, spring.name) : null;
    if (mismatch) warnings.push(mismatch);
    rows.filter((r) => r.options.length && !r.preferred).forEach((r) => warnings.push(`${r.slot.label}: the usual ${ENGINE_STYLE_PROFILES[spec.style].label} part isn't in the catalogue -- check the pick.`));
    document.getElementById('engineWarnings').innerHTML = warnings.map((w) => `<div class="engine-warning">⚠ ${w}</div>`).join('');

    const lines = engineBuildLines();
    const parts = lines.reduce((sum, l) => sum + (l.item.customer_price != null ? Number(l.item.customer_price) * l.quantity : 0), 0);
    const distinct = new Set(lines.map((l) => l.item.id)).size;
    const labour = distinct * (INSTALL_CHARGE_BY_JOB_TYPE.engine_building || 0);
    document.getElementById('engineTotals').innerHTML =
      `Parts <strong>${formatMoney(parts)}</strong> · Labour ${distinct} part types × ${formatMoney(INSTALL_CHARGE_BY_JOB_TYPE.engine_building)} = <strong>${formatMoney(labour)}</strong> · Total <strong>${formatMoney(parts + labour)}</strong>`;
    document.getElementById('engineApplyBtn').textContent =
      lastQuoteLines.length ? 'Replace engine on job' : 'Add engine to job';
  }

  function engineBuildLines() {
    if (!engineSpecView) return [];
    const byId = Object.fromEntries(engineItems.map((it) => [it.id, it]));
    return engineSpecView.slots
      .map((slot) => ({ slot, item: byId[engineChoice[slot.key]], quantity: slot.quantity }))
      .filter((l) => l.item);
  }

  async function initEnginePanel() {
    if (jobType !== 'engine_building') return;
    document.getElementById('enginePanel').style.display = 'block';
    const vtSel = document.getElementById('engineValvetrain');
    const styleSel = document.getElementById('engineStyle');
    vtSel.innerHTML = VALVETRAIN_OPTIONS.map((v) => `<option value="${v}">${v === 'Rotary' ? 'Rotary (Wankel)' : v}</option>`).join('');
    styleSel.innerHTML = ENGINE_STYLE_OPTIONS.map((st) => `<option value="${st.value}">${st.label}</option>`).join('');

    const saved = currentLeg?.engine_spec;
    vtSel.value = saved?.valvetrain || 'DOHC';
    refreshEngineConfigOptions(saved?.configuration || (vtSel.value === 'Rotary' ? 'Twin Rotor' : 'Inline 4'));
    styleSel.value = saved?.style || 'street';

    document.getElementById('engineParts').innerHTML = '<tr><td colspan="4" class="empty-msg">Loading parts…</td></tr>';
    try {
      [engineItems] = await Promise.all([loadEngineCatalogue(), labourRatesReady]);
    } catch (err) {
      document.getElementById('engineParts').innerHTML = `<tr><td colspan="4" class="empty-msg">Couldn't load parts: ${err.message}</td></tr>`;
      return;
    }

    // Returning to a saved build: start each dropdown on what's actually on the job.
    renderEngineBuilder();
    if (saved) {
      const onJob = await listJobItems(jobId, 'engine_building');
      engineSpecView.slots.forEach((slot) => {
        const { options } = engineSlotOptions(slot, engineItems);
        const match = onJob.find((l) => options.some((o) => o.id === l.catalogue_item_id));
        if (match) engineChoice[slot.key] = match.catalogue_item_id;
      });
      renderEngineBuilder({ keepChoices: true });
    }

    vtSel.addEventListener('change', () => { refreshEngineConfigOptions(); renderEngineBuilder(); });
    document.getElementById('engineConfig').addEventListener('change', () => renderEngineBuilder());
    styleSel.addEventListener('change', () => renderEngineBuilder());

    document.getElementById('engineApplyBtn').addEventListener('click', async () => {
      const spec = engineCurrentSpec();
      const lines = engineBuildLines();
      if (lines.length === 0) { alert('No parts to add.'); return; }
      const existing = await listJobItems(jobId, 'engine_building');
      if (existing.length && !confirm(`Replace the ${existing.length} engine part line${existing.length === 1 ? '' : 's'} already on this job with this ${engineSpecLabel(spec)} build? Removed parts go back into stock.`)) return;
      const btn = document.getElementById('engineApplyBtn');
      btn.disabled = true;
      btn.textContent = 'Adding parts…';
      try {
        for (const line of existing) {
          await removeJobItem(line.id, line.catalogue_item_id, Number(line.quantity), session?.id, jobId);
        }
        for (const line of lines) {
          await addJobItem({ jobId, catalogueItem: line.item, quantity: line.quantity, sourcingChoice: null, performedBy: session?.id, jobType: 'engine_building' });
        }
        await updateLegEngineSpec(jobId, spec);
        if (currentLeg) currentLeg.engine_spec = spec;
        logActivity({
          actorId: session?.id, action: 'engine_build_applied', entityType: 'job', entityId: jobId,
          summary: `${session?.employee_name || 'Someone'} ${existing.length ? 'replaced' : 'added'} the engine build on Job #${job?.job_number ?? ''}: ${engineSpecLabel(spec)} (${lines.length} part types)`
        });
        await refreshQuote();
      } catch (err) {
        alert(`Failed to add the engine: ${err.message}. Check the items list -- some parts may already have been added.`);
        await refreshQuote();
      } finally {
        btn.disabled = false;
        renderEngineBuilder({ keepChoices: true });
      }
    });
  }

  resolveJobType().then(() => {
    renderLegAction();
    initBuildPanel();
    initEnginePanel();
    initServicesPanel();
    return loadJobBar();
  }).then(() => Promise.all([renderFlowChrome(), showCategories(), refreshQuote()]));
</script>
