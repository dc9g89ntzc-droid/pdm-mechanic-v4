<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDM Mechanic Shop — Logs</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17181a;
    --panel-border: #2a2b2e;
    --text: #f0ebe4;
    --text-dim: #9c9691;
    --red: #d81f27;
    --red-dim: #b8181f;
    --amber: #f0a52c;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
  nav a.active { color: var(--text); background: var(--red); }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button, .btn { background: var(--red); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; }
  header button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); font-weight: 400; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border);
  }
  .filters input[type="date"] { background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .filters label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; }
  .filters button { background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }

  main { padding: 24px; max-width: 1300px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .card h2 { font-size: 14px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 8px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 1px solid var(--panel-border); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--panel-border); }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; }
  tr.voided td { opacity: 0.55; }
  tr.voided .summary-text, tr.voided .item-text { text-decoration: line-through; }
  .empty-msg { color: var(--text-dim); font-size: 13px; padding: 20px; text-align: center; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.used_on_job { background: rgba(216,31,39,0.15); color: #f0888c; }
  .badge.crafted_in { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.purchased_in { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .badge.adjustment { background: rgba(240,165,44,0.15); color: var(--amber); }
  .badge.transfer { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .badge.active-state { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.voided-state { background: rgba(216,31,39,0.15); color: #f0888c; cursor: help; }

  .void-btn {
    background: transparent; border: 1px solid var(--red); color: var(--red);
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .void-btn:hover { background: rgba(216,31,39,0.1); }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; }
  .modal h2 { font-size: 16px; margin: 0 0 4px; }
  .modal p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 16px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .modal textarea {
    width: 100%; min-height: 70px; background: var(--bg); border: 1px solid var(--panel-border);
    color: var(--text); padding: 10px; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; margin-bottom: 18px;
  }
  .modal .actions { display: flex; gap: 10px; }
  .modal .actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .modal .actions .confirm { background: var(--red); border: none; color: white; font-weight: 600; }
  .modal .actions .cancel { background: transparent; border: 1px solid var(--panel-border); color: var(--text); }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim); padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .tab.active { background: var(--red); border-color: var(--red); color: white; font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .panel-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-tools select { background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: 13px; }
  .panel-tools .count { color: var(--text-dim); font-size: 12px; margin-left: auto; }

  .badge.quick { background: rgba(240,165,44,0.15); color: var(--amber); }
  .badge.type-repair { background: rgba(216,31,39,0.15); color: #f0888c; }
  .badge.type-customisation { background: rgba(240,165,44,0.15); color: var(--amber); }
  .badge.type-performance { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.type-engine_building { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .badge.stage-completed { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.stage-ready_to_bill { background: rgba(240,165,44,0.15); color: var(--amber); }
  .badge.stage-in_progress { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .badge.stage-cancelled { background: rgba(156,150,145,0.15); color: var(--text-dim); }
  .badge.paid { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.unpaid { background: rgba(240,165,44,0.15); color: var(--amber); }
  .view-bill { background: transparent; border: 1px solid var(--panel-border); color: var(--text); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .view-bill:hover { border-color: var(--red); }
  .dim { color: var(--text-dim); }
  details summary { cursor: pointer; color: var(--text); }
  details ul { margin: 8px 0 2px; padding-left: 18px; color: var(--text-dim); }
  details li { margin: 2px 0; }

  .modal.wide { max-width: 760px; }
  .bill-preview { width: 100%; border-radius: 8px; background: white; display: block; margin-bottom: 14px; }
</style>
</head>
<body>
  <header>
    <h1>PDM Mechanic Shop</h1>
    <nav>
      <a href="my-dashboard.html">Home</a>
      <a href="dashboard.html?area=repair">Workshop</a>
      <a href="checkin.html">New Job</a>
      <a href="quick-job.html">Quick Job</a>
      <a href="customers.html">Customers</a>
      <a href="configure.html">Configure</a>
      <a href="purchasing.html">Purchasing</a>
      <a href="reports.html">Reports</a>
      <a href="logs.html" class="active">Logs</a>
      <a href="staff.html">Staff</a>
      <a href="payroll.html">Payroll</a>
      <a href="accounts.html">Accounts</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="filters">
    <input type="date" id="filterFrom" title="From date" />
    <input type="date" id="filterTo" title="To date" />
    <label><input type="checkbox" id="filterVoided" style="width:auto;" /> Show voided</label>
    <button id="clearFilters">Clear filters</button>
  </div>

  <main>
    <div class="tabs" id="tabs">
      <button class="tab" data-tab="jobs">Jobs</button>
      <button class="tab" data-tab="purchases">Purchases</button>
      <button class="tab" data-tab="payroll">Payroll</button>
      <button class="tab" data-tab="stock">Stock movements</button>
      <button class="tab" data-tab="activity">Activity</button>
    </div>

    <div class="tab-panel card" data-panel="jobs">
      <div class="panel-tools">
        <select id="jobKindFilter">
          <option value="">All jobs</option>
          <option value="full">Full jobs</option>
          <option value="quick">Quick jobs</option>
        </select>
        <select id="jobStageFilter">
          <option value="">Any stage</option>
          <option value="completed">Completed</option>
          <option value="ready_to_bill">Ready to bill</option>
          <option value="in_progress">In progress</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span class="count" id="jobsCount"></span>
      </div>
      <div id="jobsTable"></div>
    </div>

    <div class="tab-panel card" data-panel="purchases">
      <div class="panel-tools"><span class="count" id="purchasesCount"></span></div>
      <div id="purchasesTable"></div>
    </div>

    <div class="tab-panel card" data-panel="payroll">
      <div class="panel-tools">
        <select id="payrollTypeFilter">
          <option value="">All pay</option>
          <option value="shift_pay">Shift pay</option>
          <option value="commission">Commission</option>
          <option value="delivery">Deliveries</option>
        </select>
        <span class="count" id="payrollCount"></span>
      </div>
      <div id="payrollTable"></div>
    </div>

    <div class="tab-panel card" data-panel="stock">
      <div id="inventoryTable"></div>
    </div>

    <div class="tab-panel card" data-panel="activity">
      <div id="activityTable"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="billModalBackdrop">
    <div class="modal wide">
      <h2 id="billModalTitle"></h2>
      <p class="sub" id="billModalSub"></p>
      <img class="bill-preview" id="billPreview" alt="Final bill" />
      <div class="actions">
        <button class="cancel" id="billCloseBtn">Close</button>
        <a class="confirm" id="billOpenLink" target="_blank" rel="noopener" style="flex:1; padding:10px; border-radius:8px; font-size:13px; text-align:center; text-decoration:none;">Open in new tab</a>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="voidModalBackdrop">
    <div class="modal">
      <h2>Void this entry?</h2>
      <p class="sub" id="voidModalSub"></p>
      <label for="voidReason">Reason (optional)</label>
      <textarea id="voidReason" placeholder="Why this entry is being voided"></textarea>
      <div class="actions">
        <button class="cancel" id="voidCancelBtn">Cancel</button>
        <button class="confirm" id="voidConfirmBtn">Void</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/workshop.js"></script>
<script src="js/shift.js"></script>
<script src="js/catalogue.js"></script>
<script>
  const session = requireSession();
  if (session) {
    document.getElementById('whoami').textContent = `${session.employee_name} (${session.role})`;
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  applyRoleNav(session);

  let staffById = {};
  function staffName(id) {
    if (!id) return 'Unknown';
    return staffById[id] || 'Unknown';
  }
  async function loadStaff() {
    const staff = await listAllStaff();
    staffById = Object.fromEntries(staff.map((s) => [s.id, s.employee_name]));
  }

  function renderTable(container, rows, columns, rowClass) {
    if (rows.length === 0) {
      container.innerHTML = '<div class="empty-msg">Nothing here yet.</div>';
      return;
    }
    container.innerHTML = `
      <table>
        <thead><tr>${columns.map((c) => `<th${c.num ? ' class="num"' : ''}>${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map((row) => `<tr${rowClass ? ` class="${rowClass(row)}"` : ''}>${columns.map((c) => `<td${c.num ? ' class="num"' : ''}>${c.render(row)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  function currentFilters() {
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;
    return {
      fromDate: from ? new Date(from).toISOString() : null,
      // Add a day so "To" is inclusive of the whole selected date.
      toDate: to ? new Date(new Date(to).getTime() + 24 * 60 * 60 * 1000).toISOString() : null,
      includeVoided: document.getElementById('filterVoided').checked
    };
  }

  function statusBadge(row) {
    if (!row.voided_at) return '<span class="badge active-state">Active</span>';
    const reason = row.void_reason ? row.void_reason.replace(/"/g, '&quot;') : 'No reason given';
    return `<span class="badge voided-state" title="Voided by ${staffName(row.voided_by)}: ${reason}">Voided</span>`;
  }

  let activeVoidTarget = null; // { kind: 'inventory' | 'activity', id }

  function openVoidModal(kind, id, label) {
    activeVoidTarget = { kind, id };
    document.getElementById('voidModalSub').textContent = label;
    document.getElementById('voidReason').value = '';
    document.getElementById('voidModalBackdrop').classList.add('open');
  }
  function closeVoidModal() {
    document.getElementById('voidModalBackdrop').classList.remove('open');
    activeVoidTarget = null;
  }
  document.getElementById('voidCancelBtn').addEventListener('click', closeVoidModal);
  document.getElementById('voidModalBackdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('voidModalBackdrop')) closeVoidModal();
  });
  document.getElementById('voidConfirmBtn').addEventListener('click', async () => {
    if (!activeVoidTarget) return;
    const reason = document.getElementById('voidReason').value.trim();
    const btn = document.getElementById('voidConfirmBtn');
    btn.disabled = true;
    try {
      if (activeVoidTarget.kind === 'inventory') {
        await voidInventoryTransaction(activeVoidTarget.id, reason || null);
      } else {
        await voidActivityLogEntry(activeVoidTarget.id, reason || null);
      }
      closeVoidModal();
      await loadAll();
    } catch (err) {
      alert(`Failed to void: ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  async function loadInventoryLog() {
    const txns = await listInventoryTransactions({ limit: 300, ...currentFilters() });
    renderTable(document.getElementById('inventoryTable'), txns, [
      { label: 'When', render: (t) => formatDateTime(t.created_at) },
      { label: 'Item', render: (t) => `<span class="item-text">${t.catalogue_items?.name || 'Unknown item'}</span>` },
      { label: 'Type', render: (t) => `<span class="badge ${t.transaction_type}">${TRANSACTION_TYPES.find((x) => x.value === t.transaction_type)?.label || t.transaction_type}</span>` },
      { label: 'Qty', num: true, render: (t) => t.quantity },
      { label: 'Where', render: (t) => t.location ? stockLocationLabel(t.location, true) : '' },
      { label: 'Source', render: (t) => t.source_type ? purchaseSourceLabel(t.source_type) : '' },
      { label: 'Cost', num: true, render: (t) => t.unit_cost !== null ? formatMoney(t.unit_cost) : '' },
      { label: 'By', render: (t) => staffName(t.performed_by) },
      { label: 'Notes', render: (t) => t.reversal_of ? `Reversal of a voided transaction${t.notes ? ` — ${t.notes}` : ''}` : (t.notes || '') },
      { label: 'Status', render: statusBadge },
      { label: '', render: (t) => t.voided_at ? '' : `<button type="button" class="void-btn" data-id="${t.id}">Void</button>` }
    ], (t) => t.voided_at ? 'voided' : '');

    document.querySelectorAll('#inventoryTable .void-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const t = txns.find((x) => x.id === btn.dataset.id);
        openVoidModal('inventory', t.id, `${TRANSACTION_TYPES.find((x) => x.value === t.transaction_type)?.label || t.transaction_type} — ${t.catalogue_items?.name || 'Unknown item'} (${t.quantity}) on ${formatDateTime(t.created_at)}. This also reverses the stock change.`);
      });
    });
  }

  async function loadActivityLog() {
    const log = await listActivityLog({ limit: 300, ...currentFilters() });
    renderTable(document.getElementById('activityTable'), log, [
      { label: 'When', render: (l) => formatDateTime(l.created_at) },
      { label: 'By', render: (l) => staffName(l.actor_id) },
      { label: 'Summary', render: (l) => `<span class="summary-text">${l.summary}</span>` },
      { label: 'Status', render: statusBadge },
      { label: '', render: (l) => l.voided_at ? '' : `<button type="button" class="void-btn" data-id="${l.id}">Void</button>` }
    ], (l) => l.voided_at ? 'voided' : '');

    document.querySelectorAll('#activityTable .void-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const l = log.find((x) => x.id === btn.dataset.id);
        openVoidModal('activity', l.id, l.summary);
      });
    });
  }

  // ---- Jobs ----
  let jobsCache = [];

  async function loadJobsLog() {
    jobsCache = await listJobsForLog({ limit: 300, ...currentFilters() });
    renderJobsLog();
  }

  function renderJobsLog() {
    const kind = document.getElementById('jobKindFilter').value;
    const stage = document.getElementById('jobStageFilter').value;
    const jobs = jobsCache.filter((j) =>
      (!kind || (kind === 'quick') === !!j.is_quick_job) && (!stage || j.stage === stage)
    );
    document.getElementById('jobsCount').textContent = `${jobs.length} job${jobs.length === 1 ? '' : 's'}`;
    renderTable(document.getElementById('jobsTable'), jobs, [
      { label: 'When', render: (j) => formatDateTime(j.receipt_generated_at || j.created_at) },
      { label: 'Job', render: (j) => `#${j.job_number}` },
      { label: 'Work', render: (j) => j.is_quick_job
          ? '<span class="badge quick">Quick Job</span>'
          : (j.job_types || []).map((t) => `<span class="badge type-${t}">${jobTypeLabel(t)}</span>`).join(' ') || '<span class="dim">To confirm</span>' },
      { label: 'Customer', render: (j) => j.customers?.customer_name || 'Unknown' },
      { label: 'Plate', render: (j) => j.owned_vehicles?.registration || '<span class="dim">None</span>' },
      { label: 'Mechanic', render: (j) => staffName(j.assigned_staff_id) },
      { label: 'Stage', render: (j) => `<span class="badge stage-${j.stage}">${jobStageLabel(j.stage)}</span>` },
      { label: 'Discount', render: (j) => j.discount_type ? `${j.discount_type === 'staff' ? 'Staff' : 'EMS'} -${formatMoney(j.discount_amount)}` : '' },
      { label: 'Total', num: true, render: (j) => j.receipt_generated_at ? formatMoney(jobBilledTotal(j)) : '<span class="dim">Not billed</span>' },
      { label: '', render: (j) => j.receipt_document_url ? `<button type="button" class="view-bill" data-id="${j.id}">View bill</button>` : '' }
    ]);
    document.querySelectorAll('#jobsTable .view-bill').forEach((btn) => {
      btn.addEventListener('click', () => openBill(jobsCache.find((j) => j.id === btn.dataset.id)));
    });
  }

  function openBill(job) {
    document.getElementById('billModalTitle').textContent =
      `${job.is_quick_job ? 'Quick Job' : 'Job'} #${job.job_number} — ${job.customers?.customer_name || 'Unknown customer'}`;
    document.getElementById('billModalSub').textContent =
      `Billed ${formatDateTime(job.receipt_generated_at)} · ${formatMoney(jobBilledTotal(job))}`;
    document.getElementById('billPreview').src = job.receipt_document_url;
    document.getElementById('billOpenLink').href = job.receipt_document_url;
    document.getElementById('billModalBackdrop').classList.add('open');
  }
  function closeBill() {
    document.getElementById('billModalBackdrop').classList.remove('open');
    document.getElementById('billPreview').removeAttribute('src');
  }
  document.getElementById('billCloseBtn').addEventListener('click', closeBill);
  document.getElementById('billModalBackdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('billModalBackdrop')) closeBill();
  });
  document.getElementById('jobKindFilter').addEventListener('change', renderJobsLog);
  document.getElementById('jobStageFilter').addEventListener('change', renderJobsLog);

  // ---- Purchases ----
  // One row per checkout. Rows written since sql/055 share a batch_id; older
  // ones are grouped by same buyer + store + notes within a few minutes,
  // which is how a single checkout's items were written back to back.
  const LEGACY_BATCH_GAP_MS = 5 * 60 * 1000;

  function groupPurchases(txns) {
    const groups = [];
    const byBatch = {};
    let legacy = null;
    [...txns].sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach((t) => {
      if (t.batch_id) {
        if (!byBatch[t.batch_id]) {
          byBatch[t.batch_id] = { rows: [] };
          groups.push(byBatch[t.batch_id]);
        }
        byBatch[t.batch_id].rows.push(t);
        return;
      }
      const last = legacy && legacy.rows[legacy.rows.length - 1];
      const sameCheckout = last
        && last.performed_by === t.performed_by
        && last.source_type === t.source_type
        && (last.notes || '') === (t.notes || '')
        && new Date(t.created_at) - new Date(last.created_at) <= LEGACY_BATCH_GAP_MS;
      if (!sameCheckout) {
        legacy = { rows: [] };
        groups.push(legacy);
      }
      legacy.rows.push(t);
    });
    return groups.map((g) => {
      const first = g.rows[0];
      return {
        id: first.id,
        when: first.created_at,
        by: first.performed_by,
        source: first.source_type,
        location: first.location,
        notes: first.notes,
        rows: g.rows,
        total: g.rows.reduce((sum, r) => sum + Number(r.unit_cost || 0) * Number(r.quantity), 0),
        voided: g.rows.every((r) => r.voided_at)
      };
    }).reverse();
  }

  async function loadPurchasesLog() {
    const txns = await listInventoryTransactions({ limit: 1000, transactionType: 'purchased_in', ...currentFilters() });
    const groups = groupPurchases(txns.filter((t) => !t.reversal_of));
    document.getElementById('purchasesCount').textContent = `${groups.length} purchase${groups.length === 1 ? '' : 's'}`;
    renderTable(document.getElementById('purchasesTable'), groups, [
      { label: 'When', render: (g) => formatDateTime(g.when) },
      { label: 'By', render: (g) => staffName(g.by) },
      { label: 'Bought from', render: (g) => g.source ? purchaseSourceLabel(g.source) : '<span class="dim">Unknown</span>' },
      { label: 'Put into', render: (g) => g.location ? stockLocationLabel(g.location) : '' },
      { label: 'Items', render: (g) => `
          <details>
            <summary>${g.rows.length} item type${g.rows.length === 1 ? '' : 's'}</summary>
            <ul>${g.rows.map((r) => `<li${r.voided_at ? ' style="text-decoration:line-through"' : ''}>${r.quantity} × ${r.catalogue_items?.name || 'Unknown item'} @ ${r.unit_cost !== null ? formatMoney(r.unit_cost) : 'no price'}</li>`).join('')}</ul>
          </details>` },
      { label: 'Notes', render: (g) => g.notes || '' },
      { label: 'Total', num: true, render: (g) => formatMoney(g.total) }
    ], (g) => g.voided ? 'voided' : '');
  }

  // ---- Payroll ----
  const PAY_TYPE_LABELS = { shift_pay: 'Shift pay', commission: 'Commission', delivery: 'Delivery' };
  let payrollCache = [];

  async function loadPayrollLog() {
    const f = currentFilters();
    payrollCache = await listPayrollLedger({ from: f.fromDate, to: f.toDate, limit: 500 });
    renderPayrollLog();
  }

  function renderPayrollLog() {
    const type = document.getElementById('payrollTypeFilter').value;
    const rows = payrollCache.filter((e) => !type || e.entry_type === type);
    const total = rows.reduce((sum, e) => sum + Number(e.amount), 0);
    document.getElementById('payrollCount').textContent = `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'} · ${formatMoney(total)}`;
    renderTable(document.getElementById('payrollTable'), rows, [
      { label: 'When', render: (e) => formatDateTime(e.created_at) },
      { label: 'Employee', render: (e) => staffName(e.mechanic_id) },
      { label: 'Type', render: (e) => PAY_TYPE_LABELS[e.entry_type] || e.entry_type },
      { label: 'Notes', render: (e) => e.notes || '' },
      { label: 'Amount', num: true, render: (e) => formatMoney(e.amount) },
      { label: 'Status', render: (e) => e.paid ? `<span class="badge paid" title="Paid ${formatDateTime(e.paid_at)}">Paid</span>` : '<span class="badge unpaid">Unpaid</span>' }
    ]);
  }
  document.getElementById('payrollTypeFilter').addEventListener('change', renderPayrollLog);

  // ---- Tabs ----
  const TAB_LOADERS = {
    jobs: loadJobsLog,
    purchases: loadPurchasesLog,
    payroll: loadPayrollLog,
    stock: loadInventoryLog,
    activity: loadActivityLog
  };
  let activeTab = TAB_LOADERS[location.hash.slice(1)] ? location.hash.slice(1) : 'jobs';

  function showTab(tab) {
    activeTab = tab;
    history.replaceState(null, '', `#${tab}`);
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === tab));
    return TAB_LOADERS[tab]().catch((err) => {
      document.querySelector(`.tab-panel[data-panel="${tab}"]`).insertAdjacentHTML('afterbegin',
        `<div class="empty-msg">Failed to load: ${err.message}</div>`);
    });
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // Only the visible tab is fetched -- switching tabs loads that one fresh.
  function loadAll() {
    return showTab(activeTab);
  }

  [document.getElementById('filterFrom'), document.getElementById('filterTo'), document.getElementById('filterVoided')].forEach((el) => {
    el.addEventListener('change', loadAll);
  });
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.getElementById('filterFrom').value = '';
    document.getElementById('filterTo').value = '';
    document.getElementById('filterVoided').checked = false;
    loadAll();
  });

  // hasAreaAccess is DB-backed (role_permissions, sql/032) -- real
  // enforcement is RLS/the void RPCs, this just decides what to render.
  (async () => {
    if (!(await hasAreaAccess(session, 'logs'))) {
      document.querySelector('main').innerHTML = '<div class="empty-msg" style="padding:60px;">This page is restricted to your role.</div>';
      return;
    }
    loadStaff().then(loadAll);
  })();
</script>
</body>
</html>
