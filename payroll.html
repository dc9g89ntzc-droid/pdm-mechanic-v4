<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDM Mechanic Shop — Payroll</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17181a;
    --panel-border: #2a2b2e;
    --text: #f0ebe4;
    --text-dim: #9c9691;
    --red: #d81f27;
    --red-dim: #b8181f;
    --amber: #f0a52c;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
  nav a.active { color: var(--text); background: var(--red); }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button, .btn { background: var(--red); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; }
  header button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); font-weight: 400; }

  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .summary-card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; }
  .summary-card .name { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .summary-card .owed { font-size: 22px; font-weight: 700; color: var(--green); }
  .summary-card .owed.zero { color: var(--text-dim); font-weight: 400; font-size: 16px; }
  .summary-card .paid-total { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 14px; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 1px solid var(--panel-border); }
  td { padding: 8px; border-bottom: 1px solid var(--panel-border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.shift_pay { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .badge.commission { background: rgba(34,197,94,0.15); color: var(--green); }
  .paid-pill { color: var(--text-dim); font-size: 12px; }
  .mark-paid-btn { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .mark-paid-btn:hover { background: rgba(34,197,94,0.12); }
  .empty-msg { color: var(--text-dim); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>PDM Mechanic Shop</h1>
    <nav>
      <a href="dashboard.html">Workshop</a>
      <a href="checkin.html">New Job</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="reports.html">Reports</a>
      <a href="staff.html">Staff</a>
      <a href="payroll.html" class="active">Payroll</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="summary-grid" id="summaryGrid"></div>

    <div class="card">
      <h2>Ledger</h2>
      <div id="ledgerTable"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/workshop.js"></script>
<script src="js/shift.js"></script>
<script>
  const session = requireSession();
  if (session) {
    document.getElementById('whoami').textContent = `${session.employee_name} (${session.role})`;
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  applyRoleNav(session);

  if (!hasManagementAccess(session)) {
    document.querySelector('main').innerHTML = '<div class="empty-msg" style="padding:60px;">This page is restricted to management roles.</div>';
    throw new Error('Access restricted to management roles');
  }

  let staffById = {};
  let ledger = [];

  function staffName(id) {
    return staffById[id] || 'Unknown';
  }

  async function loadStaff() {
    const staff = await listAllStaff();
    staffById = Object.fromEntries(staff.map((s) => [s.id, s.employee_name]));
  }

  function renderSummary() {
    const byMechanic = {};
    ledger.forEach((entry) => {
      const key = entry.mechanic_id;
      if (!byMechanic[key]) byMechanic[key] = { owed: 0, paidTotal: 0 };
      if (entry.paid) byMechanic[key].paidTotal += Number(entry.amount);
      else byMechanic[key].owed += Number(entry.amount);
    });
    const grid = document.getElementById('summaryGrid');
    const ids = Object.keys(byMechanic);
    if (ids.length === 0) {
      grid.innerHTML = '<div class="empty-msg">No payroll activity yet.</div>';
      return;
    }
    grid.innerHTML = ids.map((id) => {
      const { owed, paidTotal } = byMechanic[id];
      return `
        <div class="summary-card">
          <div class="name">${staffName(id)}</div>
          <div class="owed ${owed === 0 ? 'zero' : ''}">${formatMoney(owed)}</div>
          <div class="paid-total">${formatMoney(paidTotal)} paid to date</div>
        </div>
      `;
    }).join('');
  }

  function renderLedger() {
    const container = document.getElementById('ledgerTable');
    if (ledger.length === 0) {
      container.innerHTML = '<div class="empty-msg">No entries yet.</div>';
      return;
    }
    container.innerHTML = `
      <table>
        <thead><tr><th>When</th><th>Mechanic</th><th>Type</th><th>Notes</th><th class="num">Amount</th><th>Status</th></tr></thead>
        <tbody>
          ${ledger.map((entry) => `
            <tr>
              <td>${formatDateTime(entry.created_at)}</td>
              <td>${staffName(entry.mechanic_id)}</td>
              <td><span class="badge ${entry.entry_type}">${entry.entry_type === 'shift_pay' ? 'Shift Pay' : 'Commission'}</span></td>
              <td>${entry.notes || ''}</td>
              <td class="num">${formatMoney(entry.amount)}</td>
              <td>${entry.paid
                ? `<span class="paid-pill">Paid ${formatDateTime(entry.paid_at)}</span>`
                : `<button class="mark-paid-btn" data-id="${entry.id}">Mark paid</button>`}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    container.querySelectorAll('.mark-paid-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        btn.disabled = true;
        try {
          await markPayrollEntryPaid(id);
          const entry = ledger.find((e) => e.id === id);
          logActivity({
            actorId: session?.id, action: 'payroll_marked_paid', entityType: 'payroll_ledger', entityId: id,
            summary: `${session?.employee_name || 'Someone'} marked a ${formatMoney(entry?.amount)} payroll entry paid for ${staffName(entry?.mechanic_id)}`
          });
          await loadLedger();
        } catch (err) {
          alert(`Failed to mark paid: ${err.message}`);
          btn.disabled = false;
        }
      });
    });
  }

  async function loadLedger() {
    ledger = await listPayrollLedger();
    renderSummary();
    renderLedger();
  }

  loadStaff().then(loadLedger);
</script>
</body>
</html>
