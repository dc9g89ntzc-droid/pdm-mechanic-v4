<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDM Mechanic Shop — Payroll</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17181a;
    --panel-border: #2a2b2e;
    --text: #f0ebe4;
    --text-dim: #9c9691;
    --red: #d81f27;
    --red-dim: #b8181f;
    --amber: #f0a52c;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
  nav a.active { color: var(--text); background: var(--red); }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button, .btn { background: var(--red); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; }
  header button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); font-weight: 400; }

  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .period-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .period-nav { display: flex; align-items: center; gap: 10px; }
  .period-nav button { background: var(--panel); border: 1px solid var(--panel-border); color: var(--text); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .period-nav button:hover { border-color: var(--red); }
  .period-label { font-size: 14px; font-weight: 600; min-width: 260px; text-align: center; }
  .period-nav .this-week-btn { font-weight: 400; color: var(--text-dim); }

  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); }
  .mark-all-btn { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .mark-all-btn:hover { background: rgba(34,197,94,0.12); }
  .mark-all-btn:disabled { opacity: 0.5; cursor: default; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: 1px solid var(--panel-border); }
  td { padding: 8px; border-bottom: 1px solid var(--panel-border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.iban { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-dim); letter-spacing: 0.01em; }
  td.total { font-weight: 700; }
  .paid-pill { color: var(--text-dim); font-size: 12px; }
  .mark-paid-btn { background: transparent; border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .mark-paid-btn:hover { background: rgba(34,197,94,0.12); }
  .mark-paid-btn:disabled { opacity: 0.5; cursor: default; }
  .empty-msg { color: var(--text-dim); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>PDM Mechanic Shop</h1>
    <nav>
      <a href="my-dashboard.html">Home</a>
      <a href="dashboard.html">Workshop</a>
      <a href="checkin.html">New Job</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="purchasing.html">Purchasing</a>
      <a href="reports.html">Reports</a>
      <a href="staff.html">Staff</a>
      <a href="payroll.html" class="active">Payroll</a>
      <a href="accounts.html">Accounts</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="period-bar">
      <div class="period-nav">
        <button id="prevWeekBtn">&larr; Previous week</button>
        <span class="period-label" id="periodLabel"></span>
        <button id="nextWeekBtn">Next week &rarr;</button>
      </div>
      <button class="period-nav this-week-btn" id="thisWeekBtn" style="background:transparent;">This week</button>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Payroll</h2>
        <button class="mark-all-btn" id="markAllBtn">Mark all unpaid this week as paid</button>
      </div>
      <div id="payrollTable"></div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/workshop.js"></script>
<script src="js/shift.js"></script>
<script>
  const session = requireSession();
  if (session) {
    document.getElementById('whoami').textContent = `${session.employee_name} (${session.role})`;
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  applyRoleNav(session);

  let staffById = {};
  let ledger = [];
  let periodStart = getPayPeriodStart(new Date());

  function staffName(id) {
    return staffById[id]?.employee_name || 'Unknown';
  }

  async function loadStaff() {
    const staff = await listAllStaffFull();
    staffById = Object.fromEntries(staff.map((s) => [s.id, s]));
    return staff;
  }

  function renderPeriodBar() {
    document.getElementById('periodLabel').textContent = formatPayPeriodLabel(periodStart);
    const isCurrent = periodStart.getTime() === getPayPeriodStart(new Date()).getTime();
    document.getElementById('thisWeekBtn').style.visibility = isCurrent ? 'hidden' : 'visible';
  }

  // One row per active employee: hours worked, what they're owed for those
  // hours (shift pay), labour/commission earned, the total, and a per-
  // employee Mark Paid that clears everything they're still owed this
  // period in one go.
  function renderPayrollTable(staff, shifts) {
    const activeStaff = staff.filter((s) => s.active).sort((a, b) => a.employee_name.localeCompare(b.employee_name));
    const container = document.getElementById('payrollTable');
    if (activeStaff.length === 0) {
      container.innerHTML = '<div class="empty-msg">No active staff.</div>';
      return;
    }

    const hoursMsByMechanic = {};
    shifts.forEach((s) => {
      const start = new Date(s.clock_in);
      const end = s.clock_out ? new Date(s.clock_out) : new Date();
      hoursMsByMechanic[s.mechanic_id] = (hoursMsByMechanic[s.mechanic_id] || 0) + (end - start);
    });

    const payByMechanic = {};
    ledger.forEach((entry) => {
      const key = entry.mechanic_id;
      if (!payByMechanic[key]) payByMechanic[key] = { shiftPay: 0, commission: 0, owed: 0 };
      if (entry.entry_type === 'shift_pay') payByMechanic[key].shiftPay += Number(entry.amount);
      else payByMechanic[key].commission += Number(entry.amount);
      if (!entry.paid) payByMechanic[key].owed += Number(entry.amount);
    });

    container.innerHTML = `
      <table>
        <thead><tr><th>Employee</th><th>IBAN</th><th class="num">Hours</th><th class="num">Shift Pay</th><th class="num">Labour</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>
          ${activeStaff.map((s) => {
            const pay = payByMechanic[s.id] || { shiftPay: 0, commission: 0, owed: 0 };
            const total = pay.shiftPay + pay.commission;
            const hours = (hoursMsByMechanic[s.id] || 0) / 3600000;
            return `
              <tr>
                <td>${s.employee_name}</td>
                <td class="iban">${s.iban || 'No IBAN on file'}</td>
                <td class="num">${hours.toFixed(1)}</td>
                <td class="num">${formatMoney(pay.shiftPay)}</td>
                <td class="num">${formatMoney(pay.commission)}</td>
                <td class="num total">${formatMoney(total)}</td>
                <td>${pay.owed > 0
                  ? `<button class="mark-paid-btn" data-id="${s.id}">Mark paid (${formatMoney(pay.owed)})</button>`
                  : `<span class="paid-pill">${total > 0 ? 'Paid' : '—'}</span>`}
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;

    container.querySelectorAll('.mark-paid-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const mechanicId = btn.dataset.id;
        const unpaid = ledger.filter((e) => e.mechanic_id === mechanicId && !e.paid);
        btn.disabled = true;
        try {
          for (const entry of unpaid) {
            await markPayrollEntryPaid(entry.id);
          }
          const total = unpaid.reduce((sum, e) => sum + Number(e.amount), 0);
          logActivity({
            actorId: session?.id, action: 'payroll_marked_paid', entityType: 'payroll_ledger', entityId: mechanicId,
            summary: `${session?.employee_name || 'Someone'} marked ${formatMoney(total)} paid for ${staffName(mechanicId)} (week of ${formatPayPeriodLabel(periodStart)})`
          });
          await loadPayroll();
        } catch (err) {
          alert(`Failed to mark paid: ${err.message}`);
          btn.disabled = false;
        }
      });
    });
  }

  async function loadPayroll() {
    renderPeriodBar();
    const from = periodStart.toISOString();
    const to = new Date(periodStart.getTime() + 7 * 24 * 60 * 60 * 1000).toISOString();
    const [staff, shifts, ledgerRows] = await Promise.all([
      loadStaff(),
      listShiftsForPeriod(from, to),
      listPayrollLedger({ from, to })
    ]);
    ledger = ledgerRows;
    renderPayrollTable(staff, shifts);
  }

  document.getElementById('prevWeekBtn').addEventListener('click', () => {
    periodStart = new Date(periodStart.getTime() - 7 * 24 * 60 * 60 * 1000);
    loadPayroll();
  });
  document.getElementById('nextWeekBtn').addEventListener('click', () => {
    periodStart = new Date(periodStart.getTime() + 7 * 24 * 60 * 60 * 1000);
    loadPayroll();
  });
  document.getElementById('thisWeekBtn').addEventListener('click', () => {
    periodStart = getPayPeriodStart(new Date());
    loadPayroll();
  });

  document.getElementById('markAllBtn').addEventListener('click', async () => {
    const unpaid = ledger.filter((e) => !e.paid);
    if (unpaid.length === 0) { alert('Nothing unpaid this week.'); return; }
    if (!confirm(`Mark all ${unpaid.length} unpaid entries this week as paid?`)) return;
    const btn = document.getElementById('markAllBtn');
    btn.disabled = true;
    try {
      for (const entry of unpaid) {
        await markPayrollEntryPaid(entry.id);
      }
      logActivity({
        actorId: session?.id, action: 'payroll_marked_paid_bulk', entityType: 'payroll_ledger', entityId: null,
        summary: `${session?.employee_name || 'Someone'} marked ${unpaid.length} payroll entries paid for the week of ${formatPayPeriodLabel(periodStart)}`
      });
      await loadPayroll();
    } catch (err) {
      alert(`Failed to mark all paid: ${err.message}`);
    } finally {
      btn.disabled = false;
    }
  });

  // hasAreaAccess is DB-backed (role_permissions, sql/027) -- real
  // enforcement is RLS, this just decides what to render.
  (async () => {
    if (!(await hasAreaAccess(session, 'payroll'))) {
      document.querySelector('main').innerHTML = '<div class="empty-msg" style="padding:60px;">This page is restricted to your role.</div>';
      return;
    }
    loadPayroll();
  })();
</script>
</body>
</html>
