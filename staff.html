<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDM Mechanic Shop — Staff</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17181a;
    --panel-border: #2a2b2e;
    --text: #f0ebe4;
    --text-dim: #9c9691;
    --red: #d81f27;
    --red-dim: #b8181f;
    --amber: #f0a52c;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--panel-border); flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 8px; }
  nav a { color: var(--text-dim); text-decoration: none; font-size: 13px; padding: 8px 14px; border-radius: 8px; }
  nav a.active { color: var(--text); background: var(--red); }
  header .who { color: var(--text-dim); font-size: 13px; }
  header button, .btn { background: var(--red); border: none; color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; }
  header button.secondary, .btn.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); font-weight: 400; }

  .actions-row { padding: 16px 24px; display: flex; justify-content: flex-end; background: var(--panel); border-bottom: 1px solid var(--panel-border); }

  main { padding: 24px; max-width: 800px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; overflow: hidden; font-size: 13px; }
  thead th { text-align: left; padding: 10px 14px; color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--panel-border); }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--panel-border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); cursor: pointer; }
  tbody tr.inactive { opacity: 0.5; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .badge.active { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge.inactive { background: rgba(156,150,145,0.15); color: var(--text-dim); }
  .empty-msg { color: var(--text-dim); font-size: 13px; padding: 40px; text-align: center; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 10; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; }
  .modal h2 { font-size: 16px; margin: 0 0 4px; }
  .modal h3 { font-size: 12px; margin: 20px 0 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; border-top: 1px solid var(--panel-border); padding-top: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; margin-top: 12px; }
  .modal label:first-of-type { margin-top: 0; }
  .modal input, .modal select { width: 100%; background: var(--bg); border: 1px solid var(--panel-border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 14px; }
  .modal .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .modal .checkbox-row input { width: auto; }
  .modal .actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal .actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .modal .actions .save { background: var(--red); border: none; color: white; font-weight: 600; }
  .modal .actions .cancel { background: transparent; border: 1px solid var(--panel-border); color: var(--text); }
  .reset-row { display: flex; gap: 8px; align-items: flex-end; }
  .reset-row > div { flex: 1; }
  .reset-row button { flex: 0 0 auto; background: transparent; border: 1px solid var(--panel-border); color: var(--text); border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
  .hint { color: var(--text-dim); font-size: 12px; margin: 4px 0 0; }
  .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin: 28px 0 12px; }
  .perm-table th, .perm-table td { text-align: center; }
  .perm-table th:first-child, .perm-table td:first-child { text-align: left; }
  .perm-table input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1>PDM Mechanic Shop</h1>
    <nav>
      <a href="my-dashboard.html">Home</a>
      <a href="dashboard.html?area=repair">Workshop</a>
      <a href="checkin.html">New Job</a>
      <a href="configure.html">Configure</a>
      <a href="purchasing.html">Purchasing</a>
      <a href="reports.html">Reports</a>
      <a href="logs.html">Logs</a>
      <a href="staff.html" class="active">Staff</a>
      <a href="payroll.html">Payroll</a>
      <a href="accounts.html">Accounts</a>
    </nav>
    <div style="display:flex; align-items:center; gap:16px;">
      <span class="who" id="whoami"></span>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="actions-row">
    <button class="btn" id="newStaffBtn">+ New Staff</button>
  </div>

  <main>
    <table>
      <thead><tr><th>Name</th><th>Role</th><th>Status</th></tr></thead>
      <tbody id="staffBody"></tbody>
    </table>

    <div class="section-title">Role Permissions</div>
    <table class="perm-table">
      <thead id="permHead"></thead>
      <tbody id="permBody"></tbody>
    </table>
  </main>

  <!-- New staff modal -->
  <div class="modal-backdrop" id="newModalBackdrop">
    <div class="modal">
      <h2>New staff member</h2>
      <label>Employee name</label>
      <input type="text" id="nName" />
      <label>Password</label>
      <input type="password" id="nPassword" />
      <label>Role</label>
      <select id="nRole"></select>
      <p class="hint">What this role can access is configured in the Role Permissions table below.</p>
      <label>Citizen ID</label>
      <input type="text" id="nCitizenId" />
      <label>Phone number</label>
      <input type="text" id="nPhoneNumber" />
      <label>IBAN (bank code)</label>
      <input type="text" id="nIban" />
      <label>Discord ID</label>
      <input type="text" id="nDiscordId" />
      <div class="actions">
        <button class="cancel" id="newCancelBtn">Cancel</button>
        <button class="save" id="newSaveBtn">Create</button>
      </div>
    </div>
  </div>

  <!-- Edit staff modal -->
  <div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal">
      <h2 id="editModalTitle">Edit staff member</h2>
      <label>Role</label>
      <select id="eRole"></select>
      <div class="checkbox-row">
        <input type="checkbox" id="eActive" />
        <label style="margin:0;">Active</label>
      </div>
      <label>Citizen ID</label>
      <input type="text" id="eCitizenId" />
      <label>Phone number</label>
      <input type="text" id="ePhoneNumber" />
      <label>IBAN (bank code)</label>
      <input type="text" id="eIban" />
      <label>Discord ID</label>
      <input type="text" id="eDiscordId" />
      <div class="actions">
        <button class="cancel" id="editCancelBtn">Cancel</button>
        <button class="save" id="editSaveBtn">Save</button>
      </div>

      <h3>Reset password</h3>
      <div class="reset-row">
        <div><input type="password" id="eNewPassword" placeholder="New password" /></div>
        <button id="resetPasswordBtn">Reset</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/workshop.js"></script>
<script src="js/shift.js"></script>
<script>
  const session = requireSession();
  if (session) {
    document.getElementById('whoami').textContent = `${session.employee_name} (${session.role})`;
  }
  document.getElementById('logoutBtn').addEventListener('click', logout);
  applyRoleNav(session);

  let staffList = [];
  let editingId = null;

  document.getElementById('nRole').innerHTML = STAFF_ROLES.map((r) => `<option value="${r.value}">${r.label}</option>`).join('');
  document.getElementById('eRole').innerHTML = STAFF_ROLES.map((r) => `<option value="${r.value}">${r.label}</option>`).join('');

  async function loadStaff() {
    staffList = await listAllStaffFull();
    const body = document.getElementById('staffBody');
    if (staffList.length === 0) {
      body.innerHTML = '<tr><td colspan="3"><div class="empty-msg">No staff yet.</div></td></tr>';
      return;
    }
    body.innerHTML = '';
    staffList.forEach((s) => {
      const tr = document.createElement('tr');
      if (!s.active) tr.className = 'inactive';
      tr.innerHTML = `
        <td>${s.employee_name}</td>
        <td>${staffRoleLabel(s.role)}</td>
        <td><span class="badge ${s.active ? 'active' : 'inactive'}">${s.active ? 'Active' : 'Inactive'}</span></td>
      `;
      tr.addEventListener('click', () => openEditModal(s));
      body.appendChild(tr);
    });
  }

  // ---- New staff modal ----
  const newModalBackdrop = document.getElementById('newModalBackdrop');
  document.getElementById('newStaffBtn').addEventListener('click', () => {
    document.getElementById('nName').value = '';
    document.getElementById('nPassword').value = '';
    document.getElementById('nRole').value = 'mechanic';
    document.getElementById('nCitizenId').value = '';
    document.getElementById('nPhoneNumber').value = '';
    document.getElementById('nIban').value = '';
    document.getElementById('nDiscordId').value = '';
    newModalBackdrop.classList.add('open');
  });
  document.getElementById('newCancelBtn').addEventListener('click', () => newModalBackdrop.classList.remove('open'));
  newModalBackdrop.addEventListener('click', (e) => { if (e.target === newModalBackdrop) newModalBackdrop.classList.remove('open'); });

  document.getElementById('newSaveBtn').addEventListener('click', async () => {
    const employeeName = document.getElementById('nName').value.trim();
    const password = document.getElementById('nPassword').value;
    const role = document.getElementById('nRole').value;
    const citizenId = document.getElementById('nCitizenId').value.trim();
    const phoneNumber = document.getElementById('nPhoneNumber').value.trim();
    const iban = document.getElementById('nIban').value.trim();
    const discordId = document.getElementById('nDiscordId').value.trim();
    if (!employeeName || !password) { alert('Name and password are required.'); return; }
    try {
      const created = await createStaff({ employeeName, password, role, citizenId, phoneNumber, iban, discordId });
      logActivity({
        actorId: session?.id, action: 'staff_created', entityType: 'mechanic_employee', entityId: created?.id,
        summary: `${session?.employee_name || 'Someone'} created staff account "${employeeName}" (${staffRoleLabel(role)})`
      });
      newModalBackdrop.classList.remove('open');
      await loadStaff();
    } catch (err) {
      alert(`Failed to create staff: ${err.message}`);
    }
  });

  // ---- Edit staff modal ----
  const editModalBackdrop = document.getElementById('editModalBackdrop');
  function openEditModal(s) {
    editingId = s.id;
    document.getElementById('editModalTitle').textContent = s.employee_name;
    document.getElementById('eRole').value = s.role;
    document.getElementById('eActive').checked = s.active;
    document.getElementById('eCitizenId').value = s.citizen_id || '';
    document.getElementById('ePhoneNumber').value = s.phone_number || '';
    document.getElementById('eIban').value = s.iban || '';
    document.getElementById('eDiscordId').value = s.discord_id || '';
    document.getElementById('eNewPassword').value = '';
    editModalBackdrop.classList.add('open');
  }
  document.getElementById('editCancelBtn').addEventListener('click', () => editModalBackdrop.classList.remove('open'));
  editModalBackdrop.addEventListener('click', (e) => { if (e.target === editModalBackdrop) editModalBackdrop.classList.remove('open'); });

  document.getElementById('editSaveBtn').addEventListener('click', async () => {
    if (!editingId) return;
    const role = document.getElementById('eRole').value;
    const active = document.getElementById('eActive').checked;
    const citizenId = document.getElementById('eCitizenId').value.trim();
    const phoneNumber = document.getElementById('ePhoneNumber').value.trim();
    const iban = document.getElementById('eIban').value.trim();
    const discordId = document.getElementById('eDiscordId').value.trim();
    try {
      await updateStaff({ id: editingId, role, active, citizenId, phoneNumber, iban, discordId });
      const staffMember = staffList.find((s) => s.id === editingId);
      logActivity({
        actorId: session?.id, action: 'staff_updated', entityType: 'mechanic_employee', entityId: editingId,
        summary: `${session?.employee_name || 'Someone'} updated "${staffMember?.employee_name || editingId}" -- role: ${staffRoleLabel(role)}, active: ${active}`
      });
      editModalBackdrop.classList.remove('open');
      await loadStaff();
    } catch (err) {
      alert(`Failed to update staff: ${err.message}`);
    }
  });

  document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
    if (!editingId) return;
    const newPassword = document.getElementById('eNewPassword').value;
    if (!newPassword) { alert('Enter a new password first.'); return; }
    if (!confirm('Reset this password now?')) return;
    try {
      await resetStaffPassword(editingId, newPassword);
      const staffMember = staffList.find((s) => s.id === editingId);
      logActivity({
        actorId: session?.id, action: 'staff_password_reset', entityType: 'mechanic_employee', entityId: editingId,
        summary: `${session?.employee_name || 'Someone'} reset the password for "${staffMember?.employee_name || editingId}"`
      });
      document.getElementById('eNewPassword').value = '';
      alert('Password reset.');
    } catch (err) {
      alert(`Failed to reset password: ${err.message}`);
    }
  });

  // ---- Role permissions matrix ----
  function areaLabel(area) {
    return PERMISSION_AREAS.find((a) => a.value === area)?.label || area;
  }

  async function loadPermissionsMatrix() {
    const map = await loadPermissionMap();
    document.getElementById('permHead').innerHTML =
      `<tr><th>Area</th>${STAFF_ROLES.map((r) => `<th>${r.label}</th>`).join('')}</tr>`;
    document.getElementById('permBody').innerHTML = PERMISSION_AREAS.map((area) => `
      <tr>
        <td>${area.label}</td>
        ${STAFF_ROLES.map((r) => `<td><input type="checkbox" class="perm-checkbox" data-role="${r.value}" data-area="${area.value}" ${map[r.value]?.[area.value] ? 'checked' : ''} /></td>`).join('')}
      </tr>
    `).join('');

    document.querySelectorAll('.perm-checkbox').forEach((cb) => {
      cb.addEventListener('change', async () => {
        const role = cb.dataset.role;
        const area = cb.dataset.area;
        const allowed = cb.checked;

        // Refusing to remove the last role with Staff access -- otherwise
        // nobody could ever reopen this matrix to fix it.
        if (area === 'staff' && !allowed) {
          const map = await loadPermissionMap();
          const othersWithStaffAccess = STAFF_ROLES.filter((r) => r.value !== role && map[r.value]?.staff).length;
          if (othersWithStaffAccess === 0) {
            alert('At least one role needs Staff access, or nobody could reopen this page to fix it. Grant it to another role first.');
            cb.checked = true;
            return;
          }
        }

        cb.disabled = true;
        try {
          await updateRolePermission(role, area, allowed);
          logActivity({
            actorId: session?.id, action: 'role_permission_changed', entityType: 'role_permissions', entityId: null,
            summary: `${session?.employee_name || 'Someone'} ${allowed ? 'granted' : 'revoked'} ${staffRoleLabel(role)} access to ${areaLabel(area)}`
          });
        } catch (err) {
          alert(`Failed to update permission: ${err.message}`);
          cb.checked = !allowed;
        } finally {
          cb.disabled = false;
        }
      });
    });
  }

  // hasAreaAccess is DB-backed (role_permissions, sql/027) -- real
  // enforcement is RLS, this just decides what to render.
  (async () => {
    if (!(await hasAreaAccess(session, 'staff'))) {
      document.querySelector('.actions-row').remove();
      document.querySelector('main').innerHTML = '<div class="empty-msg" style="padding:60px;">This page is restricted to your role.</div>';
      return;
    }
    loadStaff();
    loadPermissionsMatrix();
  })();
</script>
</body>
</html>
